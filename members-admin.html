<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.sb=supabase.createClient("https://chcfhxkggbrlxaopnfum.supabase.co","sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D");</script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif}body{background:#07163c;color:#241d11;padding:18px}.wrap{max-width:1100px;margin:auto;background:#fff8df;border:4px solid #d7a62d;border-radius:24px;padding:20px;box-shadow:0 18px 55px #0007}h1,h2{color:#0b1c4b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:2px solid #d9bd6a;border-radius:15px;padding:14px;margin:12px 0}label{display:block;font-weight:800;margin:10px 0}input,select,textarea{width:100%;padding:11px;border:2px solid #cfad55;border-radius:10px;font:inherit}.btn,button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#0b1c4b;color:#fff}.good{background:#16843f;color:#fff}.warn{background:#c47d00;color:#fff}.bad{background:#a92323;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:900;min-height:25px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="top"><h1>👥 ניהול חברי בית הכנסת</h1><div class="actions"><a class="btn primary" href="synagogue-admin.html">⚙️ ניהול הלוח</a><button id="logout" class="btn bad">יציאה</button></div></div><div id="st" class="status"></div><div id="list"></div></main><script>
let sid='';const X=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('login.html');const{data:p}=await sb.from('app_profiles').select('*').eq('user_id',session.user.id).single();if(p?.role!=='synagogue_owner'||p.status!=='approved'||!p.synagogue_id)return location.replace('login.html');sid=p.synagogue_id;localStorage.setItem('synagogue_id',sid)}
async function load(){const{data,error}=await sb.from('synagogue_members').select('*').eq('synagogue_id',sid).order('created_at',{ascending:false});if(error)return st.textContent='⚠ '+error.message;list.innerHTML=(data||[]).map(m=>`<div class="card"><b>${X(m.full_name)}</b><br>${X(m.login_email)} ${m.phone?'• '+X(m.phone):''}<br>Status: <b>${X(m.status)}</b><div class="actions"><button class="btn good" onclick="setM('${m.id}','approved')">✓ Approve</button><button class="btn warn" onclick="setM('${m.id}','suspended')">⏸ Suspend</button><button class="btn bad" onclick="delM('${m.id}')">🗑 Delete</button></div></div>`).join('')||'<div class="card">No members yet.</div>'}
async function setM(id,status){const{error}=await sb.from('synagogue_members').update({status}).eq('id',id).eq('synagogue_id',sid);if(error)alert(error.message);else load()}async function delM(id){if(!confirm('Delete member?'))return;const{error}=await sb.from('synagogue_members').delete().eq('id',id).eq('synagogue_id',sid);if(error)alert(error.message);else load()}logout.onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};(async()=>{await guard();await load()})();
</script></body></html>
