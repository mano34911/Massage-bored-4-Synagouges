<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.sb=supabase.createClient("https://chcfhxkggbrlxaopnfum.supabase.co","sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D");</script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif}body{background:#07163c;color:#241d11;padding:18px}.wrap{max-width:1100px;margin:auto;background:#fff8df;border:4px solid #d7a62d;border-radius:24px;padding:20px;box-shadow:0 18px 55px #0007}h1,h2{color:#0b1c4b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:2px solid #d9bd6a;border-radius:15px;padding:14px;margin:12px 0}label{display:block;font-weight:800;margin:10px 0}input,select,textarea{width:100%;padding:11px;border:2px solid #cfad55;border-radius:10px;font:inherit}.btn,button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#0b1c4b;color:#fff}.good{background:#16843f;color:#fff}.warn{background:#c47d00;color:#fff}.bad{background:#a92323;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:900;min-height:25px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="top"><h1>🪪 אזור החברים / Member Portal</h1><button id="logout" class="btn bad">יציאה</button></div><div id="st" class="status"></div><section class="card"><h2>החברות שלי</h2><div id="membership"></div></section><section class="card"><h2>💚 תרומות / Donations</h2><p>Donation portal for your own synagogue.</p><a id="donate" class="btn good" target="_blank" rel="noopener">Donate with Zeffy</a></section><section class="card"><h2>🏛️ בית הכנסת שלי</h2><div id="synInfo"></div><a class="btn primary" href="index.html?stay=1">Open Board</a></section></main><script>
async function go(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('login.html');const{data:p}=await sb.from('app_profiles').select('*').eq('user_id',session.user.id).single();if(p?.role!=='member'||!p.synagogue_id)return location.replace('login.html');if(p.status!=='approved')return st.textContent='Waiting for approval.';const{data:m}=await sb.from('synagogue_members').select('*').eq('auth_user_id',session.user.id).single();if(!m||m.status!=='approved')return st.textContent='Membership is not approved.';membership.innerHTML=`<b>${m.full_name}</b><br>${m.login_email}<br>Status: ${m.status}`;const{data:s}=await sb.from('synagogues').select('name,hebrew_name,rabbi_name,donation_url').eq('id',p.synagogue_id).single();synInfo.innerHTML=`<b>${s?.hebrew_name||s?.name||''}</b><br>Rabbi: ${s?.rabbi_name||''}`;donate.href=s?.donation_url||'https://www.zeffy.com/'}
logout.onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};go();
</script></body></html>
