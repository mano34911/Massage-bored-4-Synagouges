<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Church Member</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#194b85,#07172e 55%,#020711);font-family:Arial,sans-serif;color:#fff}.card{width:min(720px,96vw);background:#0a1c35;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009}h1{text-align:center;color:#f8d66b;margin:0 0 6px}.muted{text-align:center;color:#d8e2f4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.wide{grid-column:1/-1}label{font-weight:900}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn,button{border:0;border-radius:11px;padding:12px 18px;background:#ffc439;color:#111;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#fff;color:#09204c}.msg{text-align:center;min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><main class="card"><h1>Register as a Church Member</h1><p class="muted">Your email and password are connected only to your church.</p><div class="grid"><label class="wide">Church Board ID<input id="organizationSlug" placeholder="grace-church"></label><label>Full name<input id="fullName" autocomplete="name"></label><label>Phone<input id="phone" type="tel" autocomplete="tel"></label><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password — at least 8 characters<input id="password" type="password" minlength="8" autocomplete="new-password"></label></div><div class="actions"><button onclick="registerMember()">Create Member Account</button><a id="loginLink" class="btn secondary" href="member-loginc.html">Already Registered</a><a id="boardLink" class="btn secondary" href="indexc.html">Back to Board</a></div><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script><script>
const requestedSlug=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();if(requestedSlug){organizationSlug.value=requestedSlug;organizationSlug.readOnly=true;const q='?s='+encodeURIComponent(requestedSlug);loginLink.href='member-loginc.html'+q;boardLink.href='indexc.html'+q}
async function registerMember(){const slug=organizationSlug.value.trim().toLowerCase();if(!slug||!fullName.value.trim()||!email.value.trim()||password.value.length<8){msg.textContent='Please enter the Church Board ID, your name, email, and a password of at least 8 characters.';return}msg.textContent='Checking the church and creating your account…';try{const sb=getSupabase();const {data:board,error:be}=await sb.rpc('get_public_board',{p_slug:slug});if(be)throw be;if(!board)throw new Error('The Church Board ID was not found or is not active.');const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{account_type:'organization_member',organization_slug:slug,full_name:fullName.value.trim(),phone:phone.value.trim()}}});if(error)throw error;if(data.session){location.href='donatec.html?s='+encodeURIComponent(slug);return}msg.textContent='Your account was created. Check your email for confirmation, then log in.'}catch(e){msg.textContent=e.message||String(e)}}
</script></body></html>
