<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>כניסת חברי הקהילה</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#16458a,#061a42 55%,#020712);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#fff}.card{width:min(610px,96vw);background:#071d47;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009}h1{text-align:center;color:#f8d66b;margin:0 0 6px}.muted{text-align:center;color:#d8e2f4}.grid{display:grid;gap:14px;margin-top:20px}label{font-weight:900}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn,button{border:0;border-radius:11px;padding:12px 18px;background:#ffc439;color:#111;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#fff;color:#09204c}.msg{text-align:center;min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}</style></head>
<body class="notranslate" translate="no"><main class="card"><h1>כניסת חברי בית הכנסת</h1><p class="muted">כניסה אישית לחבר הקהילה</p><div class="grid"><label>דוא״ל<input id="email" type="email" autocomplete="email"></label><label>סיסמה<input id="password" type="password" autocomplete="current-password"></label></div><div class="actions"><button onclick="loginMember()">כניסה</button><a id="registerLink" class="btn secondary" href="member-register.html">רישום חבר חדש</a><a id="boardLink" class="btn secondary" href="index.html">חזרה ללוח</a></div><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script><script>
const requestedSlug=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
if(requestedSlug){const q='?s='+encodeURIComponent(requestedSlug);registerLink.href='member-register.html'+q;boardLink.href='index.html'+q}
async function loginMember(){msg.textContent='מתחבר…';try{const sb=getSupabase();const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;const {data:m,error:me}=await sb.from('organization_members').select('organization_slug,status').eq('user_id',data.user.id).maybeSingle();if(me)throw me;if(!m)throw new Error('חשבון זה אינו חשבון של חבר קהילה.');if(m.status!=='active')throw new Error('חשבון החבר מושעה. יש לפנות לבית הכנסת.');location.href='donate.html?s='+encodeURIComponent(m.organization_slug)}catch(e){msg.textContent=e.message||String(e)}}
</script></body></html>
