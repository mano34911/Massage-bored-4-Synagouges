<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>רישום חבר קהילה</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#16458a,#061a42 55%,#020712);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#fff}.card{width:min(720px,96vw);background:#071d47;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009}h1{text-align:center;color:#f8d66b;margin:0 0 6px}.muted{text-align:center;color:#d8e2f4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.wide{grid-column:1/-1}label{font-weight:900}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn,button{border:0;border-radius:11px;padding:12px 18px;background:#ffc439;color:#111;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#fff;color:#09204c}.msg{text-align:center;min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body class="notranslate" translate="no"><main class="card"><h1>רישום חבר לבית הכנסת</h1><p class="muted">לכל חבר יהיה דוא״ל וסיסמה משלו, המחוברים רק לבית הכנסת שלו.</p><div class="grid"><label class="wide">Board ID של בית הכנסת<input id="organizationSlug" dir="ltr" placeholder="beth-torah"></label><label>שם מלא<input id="fullName" autocomplete="name"></label><label>טלפון<input id="phone" type="tel" autocomplete="tel"></label><label>דוא״ל<input id="email" type="email" autocomplete="email"></label><label>סיסמה — לפחות 8 תווים<input id="password" type="password" minlength="8" autocomplete="new-password"></label></div><div class="actions"><button onclick="registerMember()">יצירת חשבון חבר</button><a id="loginLink" class="btn secondary" href="member-login.html">כבר רשום — כניסה</a><a id="boardLink" class="btn secondary" href="index.html">חזרה ללוח</a></div><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script><script>
const requestedSlug=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();if(requestedSlug){organizationSlug.value=requestedSlug;organizationSlug.readOnly=true;const q='?s='+encodeURIComponent(requestedSlug);loginLink.href='member-login.html'+q;boardLink.href='index.html'+q}
async function registerMember(){const slug=organizationSlug.value.trim().toLowerCase();if(!slug||!fullName.value.trim()||!email.value.trim()||password.value.length<8){msg.textContent='נא למלא Board ID, שם, דוא״ל וסיסמה של 8 תווים לפחות.';return}msg.textContent='בודק את בית הכנסת ויוצר חשבון…';try{const sb=getSupabase();const {data:board,error:be}=await sb.rpc('get_public_board',{p_slug:slug});if(be)throw be;if(!board)throw new Error('Board ID של בית הכנסת לא נמצא או אינו פעיל.');const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{account_type:'organization_member',organization_slug:slug,full_name:fullName.value.trim(),phone:phone.value.trim()}}});if(error)throw error;if(data.session){location.href='donate.html?s='+encodeURIComponent(slug);return}msg.textContent='החשבון נוצר. נא לבדוק את הדוא״ל לאישור, ואז להיכנס.'}catch(e){msg.textContent=e.message||String(e)}}
</script></body></html>
