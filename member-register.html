<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Member Registration</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);
      color:#fff;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(820px,96vw);
      background:linear-gradient(180deg,#0b2b5d,#061a3b);
      border:3px solid #d7a62d;
      border-radius:24px;
      padding:28px;
    }

    h1{
      color:#f6d469;
      text-align:center;
      margin:0 0 8px;
    }

    .synagogue-name{
      text-align:center;
      font-size:22px;
      font-weight:900;
      margin-bottom:6px;
    }

    .muted{
      text-align:center;
      color:#d8dfef;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .wide{
      grid-column:1/-1;
    }

    .sectionTitle{
      grid-column:1/-1;
      color:#f6d469;
      font-weight:900;
      font-size:18px;
      margin-top:8px;
      border-bottom:1px solid #d7a62d66;
      padding-bottom:6px;
    }

    label{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-weight:800;
    }

    input{
      width:100%;
      padding:13px;
      border-radius:10px;
      border:1px solid #d7a62d;
      background:#fff;
      color:#111;
      font-size:16px;
    }

    .member-number{
      background:#edf4ff;
      color:#0b2f72;
      border:1px solid #d7a62d;
      padding:14px;
      border-radius:10px;
      text-align:center;
      font-weight:900;
    }

    .actions{
      text-align:center;
      margin-top:20px;
    }

    button{
      border:0;
      border-radius:11px;
      padding:13px 22px;
      background:#d7a62d;
      color:#07152d;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .msg{
      text-align:center;
      margin-top:16px;
      min-height:25px;
      font-weight:800;
    }

    .error{color:#ffaaaa}
    .success{color:#9cffaa}

    @media(max-width:650px){
      .grid{
        grid-template-columns:1fr;
      }

      .wide,
      .sectionTitle{
        grid-column:auto;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Member Registration</h1>

  <div id="synagogueName" class="synagogue-name">
    Loading synagogue...
  </div>

  <div class="muted">
    Register as a member of this synagogue.
  </div>

  <div class="grid">

    <div class="sectionTitle">
      Member Information
    </div>

    <label>
      Full name
      <input id="fullName" autocomplete="name">
    </label>

    <label>
      Hebrew name
      <input id="hebrewName">
    </label>

    <label>
      Email
      <input id="email" type="email" autocomplete="email">
    </label>

    <label>
      Phone
      <input id="phone" type="tel" autocomplete="tel">
    </label>


    <div class="sectionTitle">
      Address
    </div>

    <label class="wide">
      Street address
      <input id="addressLine1" autocomplete="street-address">
    </label>

    <label>
      City
      <input id="city" autocomplete="address-level2">
    </label>

    <label>
      State / Province / Region
      <input id="stateRegion" autocomplete="address-level1">
    </label>

    <label>
      ZIP / Postal code
      <input id="postalCode" autocomplete="postal-code">
    </label>

    <label>
      Country
      <input id="country" autocomplete="country-name" value="United States">
    </label>


    <div class="sectionTitle">
      Member Number
    </div>

    <div id="memberNumberBox" class="wide member-number">
      Assigned automatically after registration
    </div>

  </div>


  <div class="actions">
    <button id="registerBtn" type="button">
      Register
    </button>
  </div>

  <div id="msg" class="msg"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="saas-common.js"></script>


<script>

let sb = null;
let synagogueRecord = null;


/* =========================================
   GET SYNAGOGUE NUMBER FROM URL
========================================= */

function getSynagogueSlug(){

  const params =
    new URLSearchParams(window.location.search);

  return (
    params.get("synagogue") ||
    params.get("slug") ||
    ""
  ).trim();

}


/* =========================================
   LOAD SYNAGOGUE
========================================= */

async function loadSynagogue(){

  const msg =
    document.getElementById("msg");

  const button =
    document.getElementById("registerBtn");

  const synagogueName =
    document.getElementById("synagogueName");

  const slug =
    getSynagogueSlug();


  if(!slug){

    synagogueName.textContent =
      "Synagogue not specified";

    msg.textContent =
      "This registration link is missing the synagogue ID.";

    msg.className =
      "msg error";

    button.disabled = true;

    return;
  }


  try{

    sb = getSupabase();


    const {
      data,
      error
    } =
      await sb.rpc(
        "get_synagogue_for_registration",
        {
          p_slug:slug
        }
      );


    if(error){
      throw error;
    }


    const synagogue =
      Array.isArray(data)
        ? data[0]
        : data;


    if(!synagogue){

      synagogueName.textContent =
        "Synagogue not found";

      msg.textContent =
        "Invalid synagogue registration link.";

      msg.className =
        "msg error";

      button.disabled = true;

      return;
    }


    synagogueRecord =
      synagogue;


    synagogueName.textContent =
      synagogue.synagogue_name;


    msg.textContent = "";

    msg.className =
      "msg";

  }
  catch(error){

    console.error(
      "Load synagogue error:",
      error
    );


    synagogueName.textContent =
      "Unable to load synagogue";


    msg.textContent =
      error.message || String(error);

    msg.className =
      "msg error";

    button.disabled = true;

  }

}


/* =========================================
   REGISTER MEMBER
========================================= */

async function registerMember(){

  const msg =
    document.getElementById("msg");

  const button =
    document.getElementById("registerBtn");

  const memberNumberBox =
    document.getElementById("memberNumberBox");


  if(!synagogueRecord){

    msg.textContent =
      "Synagogue information has not loaded.";

    msg.className =
      "msg error";

    return;
  }


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  if(!fullName){

    msg.textContent =
      "Please enter your full name.";

    msg.className =
      "msg error";

    return;
  }


  if(!email){

    msg.textContent =
      "Please enter your email address.";

    msg.className =
      "msg error";

    return;
  }


  button.disabled = true;

  msg.textContent =
    "Registering member...";

  msg.className =
    "msg";


  try{

    /*
      IMPORTANT:
      This page does NOT directly insert
      into public.synagogue_members.

      It calls the secure Supabase
      register_synagogue_member() function.
    */

    const {
      data,
      error
    } =
      await sb.rpc(
        "register_synagogue_member",
        {

          p_synagogue_slug:
            synagogueRecord.slug,

          p_full_name:
            fullName,

          p_hebrew_name:
            document
              .getElementById("hebrewName")
              .value
              .trim() || null,

          p_email:
            email,

          p_phone:
            document
              .getElementById("phone")
              .value
              .trim() || null,

          p_address_line1:
            document
              .getElementById("addressLine1")
              .value
              .trim() || null,

          p_city:
            document
              .getElementById("city")
              .value
              .trim() || null,

          p_state_region:
            document
              .getElementById("stateRegion")
              .value
              .trim() || null,

          p_postal_code:
            document
              .getElementById("postalCode")
              .value
              .trim() || null,

          p_country:
            document
              .getElementById("country")
              .value
              .trim() || null

        }
      );


    if(error){
      throw error;
    }


    const member =
      Array.isArray(data)
        ? data[0]
        : data;


    if(!member){

      throw new Error(
        "Member registration returned no data."
      );

    }


    memberNumberBox.textContent =
      member.member_number;


    msg.innerHTML =
      "Registration successful.<br>" +
      "Your member number is <strong>" +
      escapeHtml(member.member_number) +
      "</strong>.";


    msg.className =
      "msg success";


    /*
      Clear form after success
    */

    document.getElementById("fullName").value = "";
    document.getElementById("hebrewName").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("addressLine1").value = "";
    document.getElementById("city").value = "";
    document.getElementById("stateRegion").value = "";
    document.getElementById("postalCode").value = "";

  }
  catch(error){

    console.error(
      "Member registration error:",
      error
    );


    msg.textContent =
      error.message || String(error);

    msg.className =
      "msg error";

  }
  finally{

    button.disabled =
      false;

  }

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[character])
    );

}


/* =========================================
   BUTTON
========================================= */

document
  .getElementById("registerBtn")
  .addEventListener(
    "click",
    registerMember
  );


/* =========================================
   START
========================================= */

window.addEventListener(
  "DOMContentLoaded",
  loadSynagogue
);

</script>

</body>
</html>
