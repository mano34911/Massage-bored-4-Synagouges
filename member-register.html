<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Registration</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.sb=supabase.createClient("https://chcfhxkggbrlxaopnfum.supabase.co","sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D");</script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif}body{background:#07163c;color:#241d11;padding:18px}.wrap{max-width:1100px;margin:auto;background:#fff8df;border:4px solid #d7a62d;border-radius:24px;padding:20px;box-shadow:0 18px 55px #0007}h1,h2{color:#0b1c4b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:2px solid #d9bd6a;border-radius:15px;padding:14px;margin:12px 0}label{display:block;font-weight:800;margin:10px 0}input,select,textarea{width:100%;padding:11px;border:2px solid #cfad55;border-radius:10px;font:inherit}.btn,button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#0b1c4b;color:#fff}.good{background:#16843f;color:#fff}.warn{background:#c47d00;color:#fff}.bad{background:#a92323;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:900;min-height:25px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap" style="max-width:700px"><h1>📝 הרשמת חבר לבית הכנסת</h1><form id="f"><div class="grid"><label>בית הכנסת<select id="syn" required></select></label><label>שם מלא<input id="name" required></label><label>אימייל<input id="email" type="email" required></label><label>טלפון<input id="phone"></label><label>סיסמה<input id="password" type="password" minlength="6" required></label></div><button class="btn good">Register</button></form><div id="st" class="status"></div><a class="btn primary" href="login.html">Login</a></main><script>
async function loadSyn(){const{data,error}=await sb.from('synagogues').select('id,name,hebrew_name').eq('status','approved').order('name');if(error)return st.textContent='⚠ '+error.message;syn.innerHTML=(data||[]).map(s=>`<option value="${s.id}">${s.hebrew_name||s.name}</option>`).join('')}
f.onsubmit=async e=>{e.preventDefault();const meta={role:'member',synagogue_id:syn.value,full_name:name.value.trim(),phone:phone.value.trim()};const{error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:meta}});st.textContent=error?'⚠ '+error.message:'✓ Registration received. Your synagogue owner must approve you.'};loadSyn();
</script></body></html>
