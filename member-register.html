<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>רישום חבר לבית הכנסת</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#16458a,#061a42 55%,#020712);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#fff}.card{width:min(760px,96vw);background:#071d47;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009}h1{text-align:center;color:#f8d66b;margin:0 0 6px}.muted{text-align:center;color:#d8e2f4;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.wide{grid-column:1/-1}label{font-weight:900}input,select{width:100%;margin-top:6px;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px;background:#fff;color:#111}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn,button{border:0;border-radius:11px;padding:12px 18px;background:#ffc439;color:#111;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#fff;color:#09204c}.msg{text-align:center;min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}.hint{font-size:13px;color:#c9d9ef;margin-top:6px}.selected{color:#8dffb2;font-weight:900}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body class="notranslate" translate="no">
<main class="card">
<h1>רישום חבר לבית הכנסת</h1>
<p class="muted">בחר את בית הכנסת שאליו אתה שייך. החשבון שלך יחובר לבית הכנסת שנבחר בלבד.</p>
<div class="grid">
<label class="wide">בחר בית כנסת
<select id="synagogueSelect"><option value="">טוען בתי כנסת…</option></select>
<div class="hint" id="synagogueHint"></div>
</label>
<label>שם מלא<input id="fullName" autocomplete="name"></label>
<label>טלפון<input id="phone" type="tel" autocomplete="tel"></label>
<label>דוא״ל<input id="email" type="email" autocomplete="email"></label>
<label>סיסמה — לפחות 8 תווים<input id="password" type="password" minlength="8" autocomplete="new-password"></label>
</div>
<div class="actions">
<button id="registerButton" type="button" onclick="registerMember()">יצירת חשבון חבר</button>
<a id="loginLink" class="btn secondary" href="member-login.html">כבר רשום — כניסה</a>
<a id="boardLink" class="btn secondary" href="index.html">חזרה ללוח</a>
</div>
<div id="msg" class="msg"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="saas-common.js"></script>
<script>
const requestedSlug=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
let synagogueRows=[];
function setLinks(slug){
  const q=slug?'?s='+encodeURIComponent(slug):'';
  loginLink.href='member-login.html'+q;
  boardLink.href='index.html'+q;
}
async function loadSynagogues(){
  msg.textContent='טוען רשימת בתי כנסת…';
  try{
    const sb=getSupabase();
    const {data,error}=await sb.rpc('list_member_synagogues');
    if(error) throw error;
    synagogueRows=Array.isArray(data)?data:[];
    synagogueSelect.innerHTML='<option value="">בחר בית כנסת</option>';
    synagogueRows.forEach(row=>{
      const opt=document.createElement('option');
      opt.value=String(row.slug||'').toLowerCase();
      opt.textContent=row.rabbi_name?`${row.synagogue_name} — ${row.rabbi_name}`:row.synagogue_name;
      synagogueSelect.appendChild(opt);
    });
    if(requestedSlug && synagogueRows.some(r=>String(r.slug).toLowerCase()===requestedSlug)){
      synagogueSelect.value=requestedSlug;
      synagogueHint.innerHTML='נבחר לפי הלוח שממנו הגעת. אפשר לשנות את הבחירה.';
    }
    setLinks(synagogueSelect.value||requestedSlug);
    msg.textContent=synagogueRows.length?'':'לא נמצאו כרגע בתי כנסת פעילים.';
  }catch(e){
    synagogueSelect.innerHTML='<option value="">לא ניתן לטעון בתי כנסת</option>';
    msg.textContent='יש להריץ את קובץ SQL של רשימת בתי הכנסת ב-Supabase. '+(e.message||String(e));
  }
}
synagogueSelect.addEventListener('change',()=>{setLinks(synagogueSelect.value);synagogueHint.textContent=synagogueSelect.value?'החברות תירשם לבית הכנסת שנבחר.':''});
async function registerMember(){
  const slug=synagogueSelect.value.trim().toLowerCase();
  if(!slug||!fullName.value.trim()||!email.value.trim()||password.value.length<8){msg.textContent='נא לבחור בית כנסת ולמלא שם, דוא״ל וסיסמה של 8 תווים לפחות.';return}
  registerButton.disabled=true; msg.textContent='בודק את בית הכנסת ויוצר חשבון…';
  try{
    const sb=getSupabase();
    const {data:board,error:be}=await sb.rpc('get_public_board',{p_slug:slug});
    if(be) throw be;
    if(!board) throw new Error('בית הכנסת שנבחר אינו פעיל כרגע.');
    const {data,error}=await sb.auth.signUp({
      email:email.value.trim(),
      password:password.value,
      options:{data:{account_type:'organization_member',organization_slug:slug,full_name:fullName.value.trim(),phone:phone.value.trim()}}
    });
    if(error) throw error;
    if(data.session){location.href='index.html?s='+encodeURIComponent(slug);return}
    msg.textContent='החשבון נוצר וחובר לבית הכנסת שבחרת. נא לבדוק את הדוא״ל לאישור, ואז להיכנס.';
    loginLink.href='member-login.html?s='+encodeURIComponent(slug);
  }catch(e){msg.textContent=e.message||String(e)}
  finally{registerButton.disabled=false}
}
loadSynagogues();
</script>
</body>
</html>
