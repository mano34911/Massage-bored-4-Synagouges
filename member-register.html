<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="member-register-build" content="member-register-v4-all-valid-synagogues">

<title>הרשמת חבר לבית הכנסת</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
window.sb = supabase.createClient(
  "https://chcfhxkggbrlxaopnfum.supabase.co",
  "sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D"
);
</script>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Noto Sans Hebrew",sans-serif
}

body{
  background:#07163c;
  color:#241d11;
  padding:18px
}

.wrap{
  max-width:700px;
  margin:auto;
  background:#fff8df;
  border:4px solid #d7a62d;
  border-radius:24px;
  padding:20px;
  box-shadow:0 18px 55px #0007
}

h1{
  color:#0b1c4b;
  text-align:center;
  margin-bottom:25px
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px
}

label{
  display:block;
  font-weight:800;
  margin:10px 0
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:2px solid #cfad55;
  border-radius:10px;
  font:inherit;
  background:#fff
}

select{
  min-height:50px;
}

.btn,
button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  margin-top:10px
}

.primary{
  background:#0b1c4b;
  color:#fff
}

.good{
  background:#16843f;
  color:#fff
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.status{
  font-weight:900;
  min-height:25px;
  padding:12px 0;
  line-height:1.5
}

.error{
  color:#a92323
}

.success{
  color:#16843f
}

.info{
  color:#0b1c4b
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center
}

.note{
  background:#fff3c9;
  border:1px solid #d7a62d;
  border-radius:10px;
  padding:12px;
  color:#0b1c4b;
  font-weight:700;
  line-height:1.5;
  margin-bottom:15px
}
</style>
</head>

<body>

<main class="wrap">

<h1>📝 הרשמת חבר לבית הכנסת</h1>

<div class="note">
בחר את בית הכנסת שלך, מלא את הפרטים ולחץ Register.
לאחר ההרשמה מנהל בית הכנסת יוכל לאשר את החברות שלך.
</div>

<form id="f">

<div class="grid">

<label>
בית הכנסת

<select id="syn" required>
<option value="">
טוען בתי כנסת...
</option>
</select>

</label>


<div id="synStatus" class="status info">
טוען רשימת בתי כנסת...
</div>


<label>
שם מלא

<input
  id="name"
  type="text"
  autocomplete="name"
  required
>
</label>


<label>
אימייל

<input
  id="email"
  type="email"
  autocomplete="email"
  required
>
</label>


<label>
טלפון

<input
  id="phone"
  type="tel"
  autocomplete="tel"
>
</label>


<label>
סיסמה

<input
  id="password"
  type="password"
  minlength="6"
  autocomplete="new-password"
  required
>
</label>

</div>


<div class="actions">

<button
  id="registerBtn"
  type="submit"
  class="btn good"
  disabled
>
Register
</button>


<a
  class="btn primary"
  href="login.html"
>
Login
</a>

</div>

</form>


<div id="st" class="status"></div>

</main>


<script>

console.log(
  "MEMBER REGISTER BUILD:",
  "member-register-v4-all-valid-synagogues"
);


const form =
  document.getElementById("f");

const syn =
  document.getElementById("syn");

const synStatus =
  document.getElementById("synStatus");

const statusBox =
  document.getElementById("st");

const registerBtn =
  document.getElementById("registerBtn");

const nameInput =
  document.getElementById("name");

const emailInput =
  document.getElementById("email");

const phoneInput =
  document.getElementById("phone");

const passwordInput =
  document.getElementById("password");


/* =====================================
   HELPER
===================================== */

function cleanStatus(value){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase();

}


/* =====================================
   LOAD SYNAGOGUES
===================================== */

async function loadSynagogues(){

  syn.innerHTML =
    '<option value="">טוען בתי כנסת...</option>';

  registerBtn.disabled =
    true;

  synStatus.className =
    "status info";

  synStatus.textContent =
    "טוען רשימת בתי כנסת...";


  try{

    /*
      IMPORTANT FIX

      We load the synagogue list WITHOUT
      requiring status = approved.

      A member must be able to choose a
      synagogue and register first.

      Clearly disabled synagogues are removed
      below.
    */

    const {
      data,
      error
    } =
      await sb
        .from("synagogues")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(error){

      console.error(
        "Synagogue load error:",
        error
      );

      syn.innerHTML =
        '<option value="">לא ניתן לטעון בתי כנסת</option>';

      synStatus.className =
        "status error";

      synStatus.textContent =
        "⚠ שגיאה בטעינת בתי הכנסת: " +
        error.message;

      return;

    }


    console.log(
      "All synagogue records:",
      data
    );


    if(
      !data ||
      data.length === 0
    ){

      syn.innerHTML =
        '<option value="">אין בתי כנסת במערכת</option>';

      synStatus.className =
        "status error";

      synStatus.textContent =
        "⚠ לא נמצאו בתי כנסת במערכת.";

      return;

    }


    /*
      DO NOT REQUIRE "approved".

      Only remove synagogue records that are
      explicitly unavailable.

      Allowed examples:

      approved
      pending
      active
      trial
      blank/null status

      Blocked examples:

      suspended
      rejected
      deleted
      disabled
      inactive
    */

    const blockedStatuses = [
      "suspended",
      "rejected",
      "deleted",
      "disabled",
      "inactive"
    ];


    const availableSynagogues =
      data.filter(function(s){

        const status =
          cleanStatus(
            s.status
          );


        return !blockedStatuses.includes(
          status
        );

      });


    console.log(
      "Selectable synagogues:",
      availableSynagogues
    );


    if(
      availableSynagogues.length === 0
    ){

      syn.innerHTML =
        '<option value="">אין בתי כנסת זמינים</option>';

      synStatus.className =
        "status error";

      synStatus.textContent =
        "⚠ בתי הכנסת במערכת כרגע אינם זמינים להרשמה.";

      return;

    }


    /*
      BUILD DROPDOWN
    */

    syn.innerHTML =
      '<option value="">בחר בית כנסת</option>';


    availableSynagogues.forEach(
      function(s){

        const option =
          document.createElement(
            "option"
          );


        option.value =
          s.id;


        /*
          Try all likely name columns.

          This prevents a blank dropdown item
          if one installation uses name and
          another uses synagogue_name.
        */

        const displayName =
          s.hebrew_name ||
          s.name ||
          s.synagogue_name ||
          s.business_name ||
          "בית כנסת";


        option.textContent =
          displayName;


        /*
          Keep status available for debugging
          without displaying it to normal users.
        */

        option.dataset.status =
          cleanStatus(
            s.status
          );


        syn.appendChild(
          option
        );

      }
    );


    synStatus.className =
      "status success";

    synStatus.textContent =
      "✓ בחר בית כנסת מהרשימה.";


    /*
      Enable register only when a synagogue
      has actually been selected.
    */

    registerBtn.disabled =
      true;

  }

  catch(err){

    console.error(
      "Unexpected synagogue error:",
      err
    );


    syn.innerHTML =
      '<option value="">שגיאה</option>';

    synStatus.className =
      "status error";

    synStatus.textContent =
      "⚠ לא ניתן להתחבר למסד הנתונים.";

  }

}


/* =====================================
   ENABLE REGISTER AFTER SYNAGOGUE CHOICE
===================================== */

syn.addEventListener(
  "change",
  function(){

    if(syn.value){

      registerBtn.disabled =
        false;

      synStatus.className =
        "status success";

      synStatus.textContent =
        "✓ בית הכנסת נבחר. ניתן להמשיך בהרשמה.";

    }
    else{

      registerBtn.disabled =
        true;

      synStatus.className =
        "status info";

      synStatus.textContent =
        "בחר בית כנסת מהרשימה.";

    }

  }
);


/* =====================================
   MEMBER REGISTRATION
===================================== */

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    statusBox.className =
      "status";

    statusBox.textContent =
      "";


    /*
      SYNAGOGUE REQUIRED
    */

    if(!syn.value){

      statusBox.className =
        "status error";

      statusBox.textContent =
        "⚠ נא לבחור בית כנסת.";

      return;

    }


    const fullName =
      nameInput
        .value
        .trim();


    const email =
      emailInput
        .value
        .trim()
        .toLowerCase();


    const phone =
      phoneInput
        .value
        .trim();


    const password =
      passwordInput
        .value;


    /*
      REQUIRED FIELDS
    */

    if(
      !fullName ||
      !email ||
      !password
    ){

      statusBox.className =
        "status error";

      statusBox.textContent =
        "⚠ נא למלא את כל שדות החובה.";

      return;

    }


    /*
      PASSWORD
    */

    if(
      password.length < 6
    ){

      statusBox.className =
        "status error";

      statusBox.textContent =
        "⚠ הסיסמה חייבת להכיל לפחות 6 תווים.";

      return;

    }


    /*
      BASIC EMAIL CHECK
    */

    if(
      !email.includes("@") ||
      !email.includes(".")
    ){

      statusBox.className =
        "status error";

      statusBox.textContent =
        "⚠ נא להזין כתובת אימייל תקינה.";

      return;

    }


    registerBtn.disabled =
      true;

    registerBtn.textContent =
      "Registering...";


    /*
      MEMBER METADATA

      This is sent into auth.users metadata
      and can be used by your Supabase trigger.
    */

    const metadata = {

      role:
        "member",

      synagogue_id:
        syn.value,

      full_name:
        fullName,

      phone:
        phone,

      member_status:
        "pending"

    };


    try{

      const {
        data,
        error
      } =
        await sb.auth.signUp({

          email:
            email,

          password:
            password,

          options:{

            data:
              metadata

          }

        });


      if(error){

        throw error;

      }


      console.log(
        "Member signup result:",
        data
      );


      if(
        !data ||
        !data.user
      ){

        throw new Error(
          "Registration did not return a user account."
        );

      }


      /*
        Registration succeeded.

        The account can now be handled by
        your existing Supabase trigger and
        synagogue owner approval system.
      */

      statusBox.className =
        "status success";

      statusBox.textContent =
        "✓ Registration received. Your synagogue owner must approve you.";


      /*
        Clear personal fields but leave the
        synagogue list available.
      */

      nameInput.value =
        "";

      emailInput.value =
        "";

      phoneInput.value =
        "";

      passwordInput.value =
        "";

      syn.value =
        "";


      registerBtn.disabled =
        true;

      registerBtn.textContent =
        "Register";


      synStatus.className =
        "status info";

      synStatus.textContent =
        "בחר בית כנסת מהרשימה.";

    }

    catch(err){

      console.error(
        "Registration error:",
        err
      );


      let errorMessage =
        err &&
        err.message
          ? err.message
          : "Registration failed. Please try again.";


      /*
        Friendlier message when the email
        already belongs to a user.
      */

      if(
        errorMessage
          .toLowerCase()
          .includes("already")
      ){

        errorMessage =
          "This email already has an account. Please use Login.";

      }


      statusBox.className =
        "status error";

      statusBox.textContent =
        "⚠ " +
        errorMessage;


      registerBtn.disabled =
        !syn.value;

      registerBtn.textContent =
        "Register";

    }

  }
);


/* =====================================
   START
===================================== */

loadSynagogues();

</script>

</body>
</html>
