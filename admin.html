<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול לוח בית הכנסת</title><style>
*{box-sizing:border-box}body{margin:0;background:#061b48;color:#241d11;font-family:Arial,"Noto Sans Hebrew",sans-serif;padding:12px}.wrap{max-width:1150px;margin:auto;background:#fff8df;border:4px solid #d7a62d;border-radius:24px;box-shadow:0 0 0 3px #fff0a4;padding:16px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{margin:0;color:#0b2f72;font-size:clamp(28px,5vw,48px)}.nav{display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;background:#fff8df;padding:10px 0;z-index:5}.nav button,.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer;background:#0b2f72;color:white}.btn.gold{background:#d7a62d;color:#2b210f}.btn.red{background:#a91e24}.btn.green{background:#17824b}.btn.gray{background:#ddd6c1;color:#132c60;text-decoration:none}.section{border:2px solid #d6bf78;border-radius:18px;padding:14px;margin:14px 0;background:#fffdf3}.section h2{color:#0b2f72;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{font-weight:900;color:#6a4b10}input,textarea,select{width:100%;padding:10px;border:2px solid #cab46d;border-radius:9px;font:inherit;background:white;margin-top:5px}textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{font-weight:900;color:#17824b;min-height:24px;text-align:center}.speedRow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}.speedRow input[type=range]{padding:0}.small{font-size:12px;color:#6b6251}.hidden{display:none}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:10px}.nav button{padding:9px 10px;font-size:13px}}
</style></head><body><div class="wrap"><div class="top"><h1>⚙️ ניהול מלא — לוח בית הכנסת</h1><a class="btn gray" href="index.html">חזרה ללוח</a></div>
<div class="nav"><button onclick="go('general')">ראשי</button><button onclick="go('prayers')">תפילות</button><button onclick="go('zmanim')">זמני היום</button><button onclick="go('center')">מרכז</button><button onclick="go('candles')">נרות</button><button onclick="go('shiur')">שיעור יומי</button><button onclick="go('speed')">מהירות וסיבוב</button><button onclick="go('control')">שליטה מיידית</button></div>

<section id="general" class="section"><h2>הגדרות כלליות וכל הקופסאות הצדדיות</h2><div class="grid"><label>שם בית הכנסת<input id="synagogue"></label><label>שם הרב<input id="rabbi"></label><label>מזל טוב<textarea id="mazal"></textarea></label><label>הודעות<textarea id="announcement"></textarea></label><label class="wide">שורת הנצחה תחתונה<input id="memorial"></label></div></section>

<section id="prayers" class="section"><h2>זמני תפילות + נוסחי תפילה + כפתורי הצגה</h2><div class="grid"><label>שחרית<input id="shacharit"></label><label>מנחה<input id="mincha"></label><label>ערבית<input id="maariv"></label><label>שיעור תורה<input id="shiurTime"></label><label>שחרית שבת<input id="shabbatShacharit"></label><label>מנחה שבת<input id="shabbatMincha"></label><label>ערבית ליל שבת<input id="shabbatMaariv"></label><label>הבדלה<input id="havdalah"></label></div>
<div class="grid" style="margin-top:14px"><label>נוסח שחרית<textarea id="pt_shacharit"></textarea><button class="btn" type="button" onclick="cmd('showShacharit')">הצג שחרית עכשיו</button></label><label>נוסח מנחה<textarea id="pt_mincha"></textarea><button class="btn" type="button" onclick="cmd('showMincha')">הצג מנחה עכשיו</button></label><label>נוסח ערבית<textarea id="pt_maariv"></textarea><button class="btn" type="button" onclick="cmd('showMaariv')">הצג ערבית עכשיו</button></label><label>שחרית שבת<textarea id="pt_shabbatShacharit"></textarea><button class="btn" type="button" onclick="cmd('showShabbatShacharit')">הצג שחרית שבת</button></label><label>מנחה שבת<textarea id="pt_shabbatMincha"></textarea><button class="btn" type="button" onclick="cmd('showShabbatMincha')">הצג מנחה שבת</button></label><label>ערבית ליל שבת<textarea id="pt_shabbatMaariv"></textarea><button class="btn" type="button" onclick="cmd('showShabbatMaariv')">הצג ערבית ליל שבת</button></label><label class="wide">הבדלה<textarea id="pt_havdalah"></textarea><button class="btn" type="button" onclick="cmd('showHavdalah')">הצג הבדלה</button></label></div><div class="actions"><button class="btn red" onclick="cmd('hidePrayer')">סגור תפילה</button></div></section>

<section id="zmanim" class="section"><h2>שליטה בכל קופסת זמני היום</h2><div class="grid3"><label>עלות השחר<input id="z_alot"></label><label>זריחה<input id="z_sunrise"></label><label>סוף זמן ק״ש<input id="z_shema"></label><label>חצות<input id="z_chatzot"></label><label>מנחה גדולה<input id="z_minchaGedola"></label><label>שקיעה<input id="z_sunset"></label><label>צאת הכוכבים<input id="z_tzeit"></label><label>הדלקת נרות<input id="z_candles"></label><label>צאת שבת<input id="z_shabbatOut"></label></div></section>

<section id="center" class="section"><h2>הקופסה המרכזית — כל שורה ניתנת לעריכה</h2><div class="grid"><label>פרשת השבוע<input id="parasha"></label><label>פרשה בקופסת מידע<input id="parashaInfo"></label><label>תחנון<input id="tachanun"></label><label>גבורות / מוריד הטל<input id="gevurot"></label><label>הלל<input id="hallel"></label><label>ברוכים הבאים<input id="centerWelcome"></label><label class="wide">שורה ירוקה<textarea id="center1"></textarea></label><label class="wide">שורה כחולה<textarea id="center2"></textarea></label><label class="wide">שורה סגולה<textarea id="center3"></textarea></label><label class="wide">שורה אדומה<textarea id="center4"></textarea></label><label class="wide">שורה טורקיז<textarea id="center5"></textarea></label><label>מוטו<input id="centerMotto"></label><label>ברכה<input id="centerBlessing"></label></div></section>

<section id="candles" class="section"><h2>ניהול דף נרות</h2><div class="grid"><label class="wide">כותרת דף נרות<input id="candleTitle"></label><label class="wide">שמות לנרות — שם אחד בכל שורה<textarea id="candleNames" style="min-height:220px"></textarea><span class="small">עד 20 שמות.</span></label></div><div class="actions"><button class="btn" onclick="saveAll();cmd('showCandle')">שמור והצג נרות עכשיו</button></div></section>

<section id="shiur" class="section"><h2>ניהול שיעור יומי</h2><div class="grid"><label>כותרת<input id="shiurTitle"></label><label>פסוק היום<textarea id="shiurPasuk"></textarea></label><label class="wide">הלכה למעשה<textarea id="shiurHalacha"></textarea></label><label class="wide">מוסר וחסידות<textarea id="shiurMussar"></textarea></label><label class="wide">המסר להיום<textarea id="shiurTakeaway"></textarea></label><label class="wide">הנצחה בדף השיעור<input id="shiurMemorial"></label></div><div class="actions"><button class="btn" onclick="saveAll();cmd('showShiur')">שמור והצג שיעור עכשיו</button></div></section>

<section id="speed" class="section"><h2>מהירות גלילה וזמן סיבוב לכל דף</h2><div class="grid"><label>מהירות גלילה — ראשי (שניות)<input id="mainScroll" type="number" min="5" max="300"></label><label>מהירות תנועת נרות<input id="candleScroll" type="number" min="5" max="300"></label><label>מהירות גלילת שיעור<input id="shiurScroll" type="number" min="5" max="300"></label><label>מהירות גלילת תפילה<input id="prayerScroll" type="number" min="10" max="600"></label><label>זמן עמוד ראשי<input id="mainDuration" type="number" min="3" max="300"></label><label>זמן דף נרות<input id="candleDuration" type="number" min="3" max="300"></label><label>זמן שיעור יומי<input id="shiurDuration" type="number" min="3" max="300"></label></div></section>

<section id="control" class="section"><h2>כפתורי שליטה מיידית</h2><div class="actions"><button class="btn green" onclick="cmd('startAll')">▶ הפעל הכל</button><button class="btn red" onclick="cmd('stopAll')">■ עצור הכל</button><button class="btn" onclick="cmd('showMain')">עמוד ראשי</button><button class="btn" onclick="cmd('showCandle')">נרות</button><button class="btn" onclick="cmd('showShiur')">שיעור יומי</button><button class="btn red" onclick="cmd('hidePrayer')">סגור תפילה</button></div></section>

<div class="actions"><button class="btn green" onclick="saveAll()">💾 שמור את כל ההגדרות</button><button class="btn gold" onclick="loadAll()">↻ טען מחדש</button><button class="btn red" onclick="resetAll()">איפוס לברירת מחדל</button><a class="btn gray" href="index.html">חזרה ללוח</a></div><div id="status" class="status"></div></div>
<script>
const defaults={synagogue:'בית הכנסת בית תורה',rabbi:'הרב ברוך',shacharit:'7:00 AM',mincha:'4:00 PM',maariv:'8:30 PM',shiurTime:'9:15 PM',shabbatShacharit:'9:00 AM',shabbatMincha:'6:30 PM',shabbatMaariv:'7:30 PM',havdalah:'9:00 PM',mazal:'ברכת מזל טוב לחברי הקהילה',announcement:'ברוכים הבאים לבית הכנסת\nנא להתעדכן בהודעות הקהילה',parasha:'פרשת נצבים־וילך',center1:'ברכת מזל טוב לכל המתפללים ובני הקהילה',center2:'יהי רצון שנזכה לתורה, לתפילה ולמעשים טובים',center3:'שבוע טוב ומבורך לכל משפחות בית הכנסת',center4:'זמני התפילה והשיעורים מתעדכנים בלוח',center5:'נא לעקוב אחר ההודעות החשובות של הקהילה',tachanun:'אומרים',parashaInfo:'נצבים־וילך',gevurot:'מוריד הטל',hallel:'אין הלל',centerWelcome:'ברוכים הבאים לבית הכנסת בית תורה',centerMotto:'תפילה • תורה • חסד • אחדות',centerBlessing:'שנזכה לשנה טובה ומתוקה ולבשורות טובות',memorial:'לעילוי נשמת זהבה חלא בת דינה זצ״ל',zmanim:{alot:'5:02 AM',sunrise:'6:38 AM',shema:'9:27 AM',chatzot:'12:10 PM',minchaGedola:'12:40 PM',sunset:'7:32 PM',tzeit:'8:06 PM',candles:'7:13 PM',shabbatOut:'8:12 PM'},candleTitle:'🕯️ נרות נשמה 🕯️',candleNames:['לעילוי נשמת זהבה חלא בת דינה זצ״ל','נר נשמה','נר נשמה','נר נשמה','נר נשמה','נר נשמה','נר נשמה','נר נשמה'],shiurTitle:'📖 שיעור יומי',shiurPasuk:'״שויתי ה׳ לנגדי תמיד״',shiurHalacha:'צדקה הניתנת בסבר פנים יפות גדולה יותר, מפני שהיא מחזקת גם את לב המקבל.',shiurMussar:'מעט אור דוחה הרבה מן החושך. כל מצווה, תפילה ומעשה חסד מוסיפים אור בעולם.',shiurTakeaway:'להוסיף היום מעשה טוב אחד, מילה טובה אחת ותפילה בכוונה.',shiurMemorial:'לעילוי נשמת זהבה חלא בת דינה זצ״ל',mainScroll:34,candleScroll:26,shiurScroll:22,prayerScroll:90,mainDuration:20,candleDuration:10,shiurDuration:20,prayerTexts:{shacharit:'',mincha:'',maariv:'',shabbatShacharit:'',shabbatMincha:'',shabbatMaariv:'',havdalah:''}};
const $=id=>document.getElementById(id);function data(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem('mb_full_settings')||'{}'))}catch(e){return structuredClone(defaults)}}
const simple=['synagogue','rabbi','shacharit','mincha','maariv','shiurTime','shabbatShacharit','shabbatMincha','shabbatMaariv','havdalah','mazal','announcement','memorial','parasha','parashaInfo','tachanun','gevurot','hallel','centerWelcome','center1','center2','center3','center4','center5','centerMotto','centerBlessing','candleTitle','shiurTitle','shiurPasuk','shiurHalacha','shiurMussar','shiurTakeaway','shiurMemorial','mainScroll','candleScroll','shiurScroll','prayerScroll','mainDuration','candleDuration','shiurDuration'];
function loadAll(){let s=data();simple.forEach(k=>{if($(k))$(k).value=s[k]??''});$('candleNames').value=(s.candleNames||[]).join('\n');Object.entries(s.zmanim||{}).forEach(([k,v])=>{let e=$('z_'+k);if(e)e.value=v});Object.entries(s.prayerTexts||{}).forEach(([k,v])=>{let e=$('pt_'+k);if(e)e.value=v});flash('ההגדרות נטענו')}
function saveAll(){let s=data();simple.forEach(k=>{if($(k))s[k]=$(k).type==='number'?Number($(k).value):$(k).value});s.candleNames=$('candleNames').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,20);s.zmanim={};['alot','sunrise','shema','chatzot','minchaGedola','sunset','tzeit','candles','shabbatOut'].forEach(k=>s.zmanim[k]=$('z_'+k).value);s.prayerTexts={};['shacharit','mincha','maariv','shabbatShacharit','shabbatMincha','shabbatMaariv','havdalah'].forEach(k=>s.prayerTexts[k]=$('pt_'+k).value);localStorage.setItem('mb_full_settings',JSON.stringify(s));localStorage.setItem('mb_main_scroll',s.mainScroll);localStorage.setItem('mb_candle_scroll',s.candleScroll);localStorage.setItem('mb_shiur_scroll',s.shiurScroll);flash('נשמר בהצלחה ✓')}
function cmd(action){localStorage.setItem('mb_command',JSON.stringify({action,at:Date.now()}));flash('הפקודה נשלחה ללוח')}
function resetAll(){if(!confirm('לאפס את כל ההגדרות?'))return;localStorage.setItem('mb_full_settings',JSON.stringify(defaults));loadAll();flash('אופס לברירת מחדל')}
function flash(t){$('status').textContent=t;setTimeout(()=>$('status').textContent='',1800)}function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}loadAll();
</script></body></html>
