*{box-sizing:border-box}

body{

.wrap{

<script>
"use strict";

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://chcfhxkggbrlxaopnfum.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";

const SYNAGOGUE_ID =
"7f4d0f89-8ee6-42a0-beac-6cd00035e1fd";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let synagogueId = SYNAGOGUE_ID;

let settingsId = null;
let contentId = null;
let prayerTextId = null;


/* =========================
   HELPERS
========================= */

const el = id =>
  document.getElementById(id);

function setStatus(message,type=""){

  const box =
    el("connectionStatus");

  box.textContent =
    message;

  box.className =
    "status " + type;
}

function checked(id){

  return !!el(id)?.checked;
}

function setCheck(id,value){

  if(!el(id)) return;

  el(id).checked =
    value !== false;
}

function value(id){

  return el(id)
    ? el(id).value.trim()
    : "";
}

function setValue(id,v,fallback=""){

  if(!el(id)) return;

  el(id).value =
    v ?? fallback;
}

function numberValue(id,fallback){

  const n =
    parseInt(
      el(id)?.value,
      10
    );

  return Number.isFinite(n)
    ? n
    : fallback;
}

function timeOnly(v){

  if(!v) return "";

  return String(v)
    .slice(0,5);
}


/* =========================
   LOAD EVERYTHING
========================= */

async function loadBoard(){

  setStatus(
    "מתחבר ל-Supabase..."
  );

  try{

    const [
      synResult,
      settingsResult,
      contentResult,
      timesResult,
      textsResult
    ] = await Promise.all([

      db
        .from("synagogues")
        .select("*")
        .eq("id",synagogueId)
        .limit(1),

      db
        .from("board_settings")
        .select("*")
        .eq("synagogue_id",synagogueId)
        .limit(1),

      db
        .from("board_content")
        .select("*")
        .eq("synagogue_id",synagogueId)
        .limit(1),

      db
        .from("prayer_times")
        .select("*")
        .eq("synagogue_id",synagogueId)
        .order("display_order"),

      db
        .from("prayer_texts")
        .select("*")
        .eq("synagogue_id",synagogueId)
        .order("sort_order")
        .limit(1)

    ]);

    if(synResult.error)
      throw synResult.error;

    if(settingsResult.error)
      throw settingsResult.error;

    if(contentResult.error)
      throw contentResult.error;

    if(timesResult.error)
      throw timesResult.error;

    if(textsResult.error)
      throw textsResult.error;


    /* =====================
       SYNAGOGUE
    ===================== */

    const synagogue =
      synResult.data?.[0];

    if(!synagogue){

      throw new Error(
        "Beth Torah synagogue was not found."
      );
    }

    el("synagogueName").innerHTML =
      "<strong>" +
      (
        synagogue.hebrew_name ||
        synagogue.name ||
        "Beth Torah"
      ) +
      "</strong><br>" +
      (
        synagogue.name ||
        "Beth Torah"
      );

    setValue(
      "hebrew_name",
      synagogue.hebrew_name
    );

    setValue(
      "english_name",
      synagogue.name
    );

    setValue(
      "rabbi_name",
      synagogue.rabbi_name
    );

    setValue(
      "timezone",
      synagogue.timezone,
      "America/New_York"
    );


    /* =====================
       SETTINGS
    ===================== */

    let settings =
      settingsResult.data?.[0];

    if(settings){

      settingsId =
        settings.id;

      fillSettings(settings);

    }else{

      settingsId = null;

      fillSettings({});

    }


    /* =====================
       CONTENT
    ===================== */

    const content =
      contentResult.data?.[0];

    if(content){

      contentId =
        content.id;

      setValue(
        "main_title",
        content.main_title
      );

      setValue(
        "parasha",
        content.parasha
      );

      setValue(
        "main_message",
        content.main_message
      );

      setValue(
        "left_notice",
        content.left_notice
      );

      setValue(
        "right_notice",
        content.right_notice
      );

      setValue(
        "ticker_text",
        content.ticker_text ||
        content.dedication
      );

      setValue(
        "content_scroll_speed",
        content.scroll_speed,
        45
      );

    }else{

      contentId = null;

    }


    /* =====================
       PRAYER TIMES
    ===================== */

    fillPrayerTimes(
      timesResult.data || []
    );


    /* =====================
       PRAYER TEXT
    ===================== */

    const prayerText =
      textsResult.data?.[0];

    if(prayerText){

      prayerTextId =
        prayerText.id;

      fillPrayerText(
        prayerText
      );

    }else{

      prayerTextId = null;

      setCheck(
        "prayer_text_enabled",
        true
      );

      setValue(
        "prayer_text_scroll_speed",
        40
      );

      setValue(
        "prayer_sort_order",
        1
      );

    }


    localStorage.setItem(
      "synagogue_id",
      synagogueId
    );

    setStatus(
      "✅ מחובר — Beth Torah",
      "connected"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }
}


/* =========================
   SETTINGS FORM
========================= */

function fillSettings(s){

  setCheck(
    "daily_lesson_enabled",
    s.daily_lesson_enabled
  );

  setValue(
    "daily_lesson_interval_minutes",
    s.daily_lesson_interval_minutes,
    30
  );

  setValue(
    "daily_lesson_duration_seconds",
    s.daily_lesson_duration_seconds,
    30
  );

  setValue(
    "daily_lesson_scroll_speed",
    s.daily_lesson_scroll_speed,
    40
  );


  setCheck(
    "candle_enabled",
    s.candle_enabled
  );

  setValue(
    "candle_interval_minutes",
    s.candle_interval_minutes,
    30
  );

  setValue(
    "candle_duration_seconds",
    s.candle_duration_seconds,
    30
  );


  setCheck(
    "fasting_enabled",
    s.fasting_enabled
  );

  setValue(
    "fasting_interval_minutes",
    s.fasting_interval_minutes,
    30
  );

  setValue(
    "fasting_duration_seconds",
    s.fasting_duration_seconds,
    30
  );


  setCheck(
    "prayer_enabled",
    s.prayer_enabled
  );

  setValue(
    "prayer_scroll_speed",
    s.prayer_scroll_speed,
    40
  );
}


/* =========================
   PRAYER TIMES FORM
========================= */

function fillPrayerTimes(list){

  for(const p of list){

    const key =
      String(
        p.prayer_key || ""
      )
      .trim()
      .toLowerCase();

    const t =
      timeOnly(
        p.prayer_time
      );

    if(key==="shacharit")
      setValue("shacharit",t);

    else if(key==="mincha")
      setValue("mincha",t);

    else if(
      key==="maariv" ||
      key==="arvit"
    )
      setValue("maariv",t);

    else if(
      key==="shiur" ||
      key==="torah"
    )
      setValue("shiur",t);

    else if(
      key==="shabbat_shacharit" ||
      key==="shacharit_shabbat"
    )
      setValue(
        "shabbat_shacharit",
        t
      );

    else if(
      key==="shabbat_mincha" ||
      key==="mincha_shabbat"
    )
      setValue(
        "shabbat_mincha",
        t
      );

    else if(
      key==="shabbat_maariv" ||
      key==="maariv_shabbat"
    )
      setValue(
        "shabbat_maariv",
        t
      );

    else if(key==="havdalah")
      setValue(
        "havdalah",
        t
      );

  }
}


/* =========================
   PRAYER TEXT FORM
========================= */

function fillPrayerText(p){

  setCheck(
    "prayer_text_enabled",
    p.enabled
  );

  setValue(
    "prayer_key",
    p.prayer_key
  );

  setValue(
    "prayer_name",
    p.prayer_name
  );

  setValue(
    "prayer_title",
    p.title
  );

  setValue(
    "prayer_full_text",
    p.full_text
  );

  setValue(
    "prayer_text_scroll_speed",
    p.scroll_speed,
    40
  );

  setValue(
    "prayer_sort_order",
    p.sort_order,
    1
  );
}


/* =========================
   SAVE SYNAGOGUE
========================= */

async function saveSynagogue(){

  const updates = {

    name:
      value("english_name"),

    hebrew_name:
      value("hebrew_name"),

    rabbi_name:
      value("rabbi_name"),

    timezone:
      value("timezone") ||
      "America/New_York"

  };

  const {error} =
    await db
      .from("synagogues")
      .update(updates)
      .eq("id",synagogueId);

  if(error)
    throw error;
}


/* =========================
   SAVE BOARD SETTINGS
========================= */

async function saveSettings(){

  const updates = {

    synagogue_id:
      synagogueId,

    daily_lesson_enabled:
      checked(
        "daily_lesson_enabled"
      ),

    daily_lesson_interval_minutes:
      numberValue(
        "daily_lesson_interval_minutes",
        30
      ),

    daily_lesson_duration_seconds:
      numberValue(
        "daily_lesson_duration_seconds",
        30
      ),

    daily_lesson_scroll_speed:
      numberValue(
        "daily_lesson_scroll_speed",
        40
      ),

    candle_enabled:
      checked(
        "candle_enabled"

/* =========================
   SAVE PRAYER TIME
========================= */

async function upsertPrayerTime(
  prayerKey,
  prayerName,
  prayerTime,
  dayType,
  order
){

  if(!prayerTime)
    return;

  const {data,error} =
    await db
      .from("prayer_times")
      .select("id")
      .eq(
        "synagogue_id",
        synagogueId
      )
      .eq(
        "prayer_key",
        prayerKey
      )
      .limit(1);

  if(error)
    throw error;

  const payload = {

    synagogue_id:
      synagogueId,

    prayer_key:
      prayerKey,

    prayer_name:
      prayerName,

    prayer_time:
      prayerTime,

    day_type:
      dayType,

    active:
      true,

    display_order:
      order

  };

  if(data && data.length){

    const result =
      await db
        .from("prayer_times")
        .update(payload)
        .eq("id",data[0].id);

    if(result.error)
      throw result.error;

  }else{

    const result =
      await db
        .from("prayer_times")
        .insert(payload);

    if(result.error)
      throw result.error;
  }
}

async function savePrayerText(
  showMessage=true
){

  try{

    if(!synagogueId){

      throw new Error(
        "Synagogue is not loaded."
      );
    }

    const payload = {

      synagogue_id:
        synagogueId,

      prayer_key:
        value("prayer_key") ||
        "shacharit",

      prayer_name:
        value("prayer_name") ||
        "שחרית",

      title:
        value("prayer_title"),

      full_text:
        value("prayer_full_text"),

      enabled:
        checked(
          "prayer_text_enabled"
        ),

      scroll_speed:
        numberValue(
          "prayer_text_scroll_speed",
          40
        ),

      sort_order:
        numberValue(
          "prayer_sort_order",
          1
        )

    };

    if(prayerTextId){

      const {error} =
        await db
          .from("prayer_texts")
          .update(payload)
          .eq(
            "id",
            prayerTextId
          );

      if(error)
        throw error;

    }else{

      const {data,error} =
        await db
          .from("prayer_texts")
          .insert(payload)
          .select()
          .single();

      if(error)
        throw error;

      prayerTextId =
        data.id;
    }

    if(showMessage){

      setStatus(
        "✅ טקסט התפילה נשמר",
        "connected"
      );
    }

  }catch(error){

    console.error(error);

    setStatus(
      "❌ לא ניתן לשמור תפילה: " +
      error.message,
      "error"
    );

    throw error;
  }
}


/* =========================
   SAVE ZMANIM LOCALLY

   Current index.html reads these
   from its local state.
========================= */

function saveZmanimCache(){

  let state = {};

  try{

    state =
      JSON.parse(
        localStorage.getItem(
          "newSynagogueBoard"
        ) || "{}"
      );

  }catch(e){

    state = {};
  }

  state.manualAlot =
    value("alot") ||
    state.manualAlot;

  state.manualSunrise =
    value("sunrise") ||
    state.manualSunrise;

  state.manualShema =
    value("shema") ||
    state.manualShema;

  state.manualChatzot =
    value("chatzot") ||
    state.manualChatzot;

  state.manualMinchaGedola =
    value("mincha_gedola") ||
    state.manualMinchaGedola;

  state.manualSunset =
    value("sunset") ||
    state.manualSunset;

  state.manualTzeit =
    value("tzeit") ||
    state.manualTzeit;

  state.manualCandles =
    value("candles") ||
    state.manualCandles;

  state.manualHavdalah =
    value("manual_havdalah") ||
    state.manualHavdalah;

  localStorage.setItem(
    "newSynagogueBoard",
    JSON.stringify(state)
  );
}

========================= */

async function saveAll(){

  if(!synagogueId){

    alert(
      "Settings are not loaded yet."
    );

    return;
  }

  setStatus(
    "💾 שומר את כל ההגדרות..."
  );

  try{

    await saveSynagogue();

    await saveSettings();

    await saveContent();

    await savePrayerTimes();

    await savePrayerText(false);

    saveZmanimCache();

    setStatus(
      "✅ כל ההגדרות נשמרו בהצלחה",
      "connected"
    );

    /*
      Reload database values so the
      administrator sees exactly what
      Supabase saved.
    */

    setTimeout(
      loadBoard,
      700
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ שגיאה בשמירה: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );
  }
}
