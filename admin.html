<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול לוח בית הכנסת</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#061b48;
  font-family:Arial,"Noto Sans Hebrew",sans-serif;
  color:#241d11;
  padding:14px
}
.wrap{
  max-width:1050px;
  margin:auto;
  background:#fff8df;
  border:4px solid #d7a62d;
  border-radius:24px;
  padding:18px
}
h1{text-align:center;color:#071d50}
.status{
  text-align:center;
  padding:12px;
  margin-bottom:16px;
  border-radius:12px;
  background:#eee
}
.connected{background:#d9f7df;color:#075b20}
.error{background:#ffdada;color:#8b0000}

.card{
  background:white;
  border:2px solid #d7a62d;
  border-radius:18px;
  padding:18px;
  margin:15px 0
}
.card h2{
  margin-top:0;
  color:#071d50
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:12px 0
}
label{font-weight:bold}
input{
  width:100%;
  padding:12px;
  border:1px solid #aaa;
  border-radius:9px;
  font-size:16px
}
.switchrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}
.switchrow input{
  width:26px;
  height:26px
}
button{
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-weight:bold;
  font-size:17px;
  cursor:pointer
}
.save{
  width:100%;
  background:#117147;
  color:white;
  margin-top:18px
}
.reload{
  background:#173b7a;
  color:white
}
@media(max-width:650px){
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<h1>ניהול לוח בית הכנסת</h1>

<div id="connectionStatus" class="status">
מתחבר ל-Supabase...
</div>

<div class="card">
  <h2>בית הכנסת</h2>
  <div id="synagogueName">טוען...</div>
</div>


<!-- DAILY LESSON -->
<div class="card">

<h2>שיעור יומי</h2>

<div class="switchrow">
<label>הפעל שיעור יומי</label>
<input id="daily_lesson_enabled" type="checkbox">
</div>

<div class="row">

<div>
<label>הצג כל כמה דקות</label>
<input id="daily_lesson_interval_minutes"
       type="number"
       min="1"
       value="30">
</div>

<div>
<label>משך הצגה בשניות</label>
<input id="daily_lesson_duration_seconds"
       type="number"
       min="1"
       value="30">
</div>

</div>

<label>מהירות גלילה</label>
<input id="daily_lesson_scroll_speed"
       type="number"
       min="1"
       value="40">

</div>


<!-- CANDLE -->
<div class="card">

<h2>🕯️ כניסת שבת / הדלקת נרות</h2>

<div class="switchrow">
<label>הפעל תצוגת שבת</label>
<input id="candle_enabled" type="checkbox">
</div>

<div class="row">

<div>
<label>הצג כל כמה דקות</label>
<input id="candle_interval_minutes"
       type="number"
       min="1"
       value="30">
</div>

<div>
<label>משך הצגה בשניות</label>
<input id="candle_duration_seconds"
       type="number"
       min="1"
       value="30">
</div>

</div>

</div>


<!-- FASTING -->
<div class="card">

<h2>זמני צום</h2>

<div class="switchrow">
<label>הפעל זמני צום</label>
<input id="fasting_enabled" type="checkbox">
</div>

<div class="row">

<div>
<label>הצג כל כמה דקות</label>
<input id="fasting_interval_minutes"
       type="number"
       min="1"
       value="30">
</div>

<div>
<label>משך הצגה בשניות</label>
<input id="fasting_duration_seconds"
       type="number"
       min="1"
       value="30">
</div>

</div>

</div>


<!-- PRAYERS -->
<div class="card">

<h2>תפילות</h2>

<div class="switchrow">
<label>הפעל תצוגת תפילות</label>
<input id="prayer_enabled" type="checkbox">
</div>

<label>מהירות גלילת התפילה</label>
<input id="prayer_scroll_speed"
       type="number"
       min="1"
       value="40">

</div>


<button class="save" onclick="saveSettings()">
💾 שמור את כל ההגדרות
</button>

<br><br>

<button class="reload" onclick="loadBoard()">
🔄 טען מחדש מ-Supabase
</button>

</div>


<script>

const SUPABASE_URL =
"https://chcfhxkggbrlxaopnfum.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let synagogueId = null;
let settingsId = null;


/* ----------------------------------
   LOAD BETH TORAH
---------------------------------- */

async function loadBoard(){

  setStatus("מתחבר ל-Supabase...");

  try{

    const {data:synagogues,error:synError} =
      await db
      .from("synagogues")
      .select("id,name,hebrew_name")
      .eq("name","Beth Torah")
      .limit(1);

    if(synError) throw synError;

    if(!synagogues || !synagogues.length){
      throw new Error("Beth Torah synagogue was not found.");
    }

    const synagogue = synagogues[0];

    synagogueId = synagogue.id;

    document.getElementById("synagogueName").innerHTML =
      "<strong>" +
      (synagogue.hebrew_name || synagogue.name) +
      "</strong><br>" +
      synagogue.name;


    /* GET SETTINGS */

    const {data:settings,error:settingsError} =
      await db
      .from("board_settings")
      .select("*")
      .eq("synagogue_id",synagogueId)
      .limit(1);

    if(settingsError) throw settingsError;

    if(!settings || !settings.length){

      const {data:newSettings,error:createError} =
        await db
        .from("board_settings")
        .insert({
          synagogue_id:synagogueId,

          main_enabled:true,

          daily_lesson_enabled:true,
          daily_lesson_interval_minutes:30,
          daily_lesson_duration_seconds:30,
          daily_lesson_scroll_speed:40,

          candle_enabled:true,
          candle_interval_minutes:30,
          candle_duration_seconds:30,

          fasting_enabled:true,
          fasting_interval_minutes:30,
          fasting_duration_seconds:30,

          prayer_enabled:true,
          prayer_scroll_speed:40
        })
        .select()
        .single();

      if(createError) throw createError;

      settingsId = newSettings.id;

      fillForm(newSettings);

    }else{

      settingsId = settings[0].id;

      fillForm(settings[0]);
    }

    setStatus(
      "✅ מחובר — Beth Torah",
      "connected"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ " + error.message,
      "error"
    );
  }
}


/* ----------------------------------
   PUT DATABASE VALUES INTO ADMIN
---------------------------------- */

function fillForm(s){

  setCheck(
    "daily_lesson_enabled",
    s.daily_lesson_enabled
  );

  setValue(
    "daily_lesson_interval_minutes",
    s.daily_lesson_interval_minutes,
    30
  );

  setValue(
    "daily_lesson_duration_seconds",
    s.daily_lesson_duration_seconds,
    30
  );

  setValue(
    "daily_lesson_scroll_speed",
    s.daily_lesson_scroll_speed,
    40
  );


  setCheck(
    "candle_enabled",
    s.candle_enabled
  );

  setValue(
    "candle_interval_minutes",
    s.candle_interval_minutes,
    30
  );

  setValue(
    "candle_duration_seconds",
    s.candle_duration_seconds,
    30
  );


  setCheck(
    "fasting_enabled",
    s.fasting_enabled
  );

  setValue(
    "fasting_interval_minutes",
    s.fasting_interval_minutes,
    30
  );

  setValue(
    "fasting_duration_seconds",
    s.fasting_duration_seconds,
    30
  );


  setCheck(
    "prayer_enabled",
    s.prayer_enabled
  );

  setValue(
    "prayer_scroll_speed",
    s.prayer_scroll_speed,
    40
  );
}


/* ----------------------------------
   SAVE
---------------------------------- */

async function saveSettings(){

  if(!synagogueId || !settingsId){
    alert("Settings are not loaded yet.");
    return;
  }

  setStatus("שומר...");


  const updates = {

    daily_lesson_enabled:
      checked("daily_lesson_enabled"),

    daily_lesson_interval_minutes:
      numberValue(
        "daily_lesson_interval_minutes",
        30
      ),

    daily_lesson_duration_seconds:
      numberValue(
        "daily_lesson_duration_seconds",
        30
      ),

    daily_lesson_scroll_speed:
      numberValue(
        "daily_lesson_scroll_speed",
        40
      ),


    candle_enabled:
      checked("candle_enabled"),

    candle_interval_minutes:
      numberValue(
        "candle_interval_minutes",
        30
      ),

    candle_duration_seconds:
      numberValue(
        "candle_duration_seconds",
        30
      ),


    fasting_enabled:
      checked("fasting_enabled"),

    fasting_interval_minutes:
      numberValue(
        "fasting_interval_minutes",
        30
      ),

    fasting_duration_seconds:
      numberValue(
        "fasting_duration_seconds",
        30
      ),


    prayer_enabled:
      checked("prayer_enabled"),

    prayer_scroll_speed:
      numberValue(
        "prayer_scroll_speed",
        40
      ),

    updated_at:
      new Date().toISOString()
  };


  const {error} =
    await db
    .from("board_settings")
    .update(updates)
    .eq("id",settingsId);


  if(error){

    console.error(error);

    setStatus(
      "❌ לא ניתן לשמור: " + error.message,
      "error"
    );

    return;
  }


  setStatus(
    "✅ ההגדרות נשמרו בהצלחה",
    "connected"
  );
}


/* ----------------------------------
   HELPERS
---------------------------------- */

function checked(id){
  return document.getElementById(id).checked;
}

function numberValue(id,fallback){

  const value =
    parseInt(
      document.getElementById(id).value,
      10
    );

  return Number.isFinite(value)
    ? value
    : fallback;
}

function setCheck(id,value){
  document.getElementById(id).checked =
    value !== false;
}

function setValue(id,value,fallback){
  document.getElementById(id).value =
    value ?? fallback;
}

function setStatus(message,type=""){

  const box =
    document.getElementById("connectionStatus");

  box.textContent = message;

  box.className =
    "status " + type;
}


/* START */

loadBoard();

</script>

</body>
</html>
