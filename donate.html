<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>תרומה לבית הכנסת</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#16458a,#061a42 55%,#020712);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#fff}.card{width:min(680px,96vw);text-align:center;background:#071d47;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009,inset 0 0 0 2px #fff2a622}h1{color:#f8d66b;margin:0 0 8px}.org{font-size:22px;font-weight:900;margin:14px}.heart{font-size:56px}.muted{color:#d8e2f4;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}.btn,button{border:0;border-radius:12px;padding:13px 19px;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;background:#fff;color:#09204c}.paypal{background:#ffc439;color:#111;font-size:19px}.secondary{background:#174f91;color:#fff;border:1px solid #86b5ee}.msg{min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}input{width:100%;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px}.slug{display:none;margin:15px auto 0;max-width:430px}.slug.show{display:block}</style></head>
<body class="notranslate" translate="no"><main class="card"><div class="heart">💛</div><h1>תרומה מאובטחת באמצעות PayPal</h1><div id="orgName" class="org">טוען את בית הכנסת…</div><p class="muted">התרומה עוברת ישירות לחשבון ה-PayPal של בית הכנסת. פרטי התשלום אינם נשמרים בלוח המודעות.</p><div id="slugBox" class="slug"><input id="slugInput" dir="ltr" placeholder="Board ID, for example: beth-torah"><div class="actions"><button onclick="loadBoard(slugInput.value)">המשך</button></div></div><div class="actions"><a id="paypalButton" class="btn paypal" href="#" target="_blank" rel="noopener">Donate with PayPal</a><a id="loginLink" class="btn secondary" href="member-login.html">כניסת חברים</a><a id="registerLink" class="btn secondary" href="member-register.html">רישום חבר חדש</a><a id="boardLink" class="btn secondary" href="index.html">חזרה ללוח</a></div><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script>
<script>
let paypalUrl='';
function validPayPalUrl(value){try{const u=new URL(String(value||'').trim());const h=u.hostname.toLowerCase();return u.protocol==='https:'&&(h==='paypal.me'||h==='www.paypal.me'||h==='paypal.com'||h==='www.paypal.com'||h.endsWith('.paypal.com'))?u.href:''}catch(e){return ''}}
function setLinks(slug){const q=slug?'?s='+encodeURIComponent(slug):'';loginLink.href='member-login.html'+q;registerLink.href='member-register.html'+q;boardLink.href='index.html'+q}
async function loadBoard(rawSlug){const slug=String(rawSlug||'').trim().toLowerCase();setLinks(slug);if(!slug){orgName.textContent='בחר בית כנסת';slugBox.classList.add('show');paypalButton.style.display='none';return}slugBox.classList.remove('show');msg.textContent='';try{const sb=getSupabase();const {data,error}=await sb.rpc('get_public_board',{p_slug:slug});if(error)throw error;const row=Array.isArray(data)?data[0]:data;if(!row)throw new Error('בית הכנסת לא נמצא או אינו פעיל.');const s=row.settings||{};orgName.textContent=s.synagogue||row.synagogue_name||'בית הכנסת';paypalUrl=validPayPalUrl(s.paypalDonationUrl);paypalButton.textContent=s.donateButtonLabel||'תרומה באמצעות PayPal';paypalButton.style.display='inline-flex';if(!paypalUrl){paypalButton.style.display='none';msg.textContent='בית הכנסת עדיין לא הוסיף קישור תרומה ל-PayPal.'}}catch(e){paypalButton.style.display='none';msg.textContent=e.message||String(e)}}
paypalButton.addEventListener('click',e=>{if(!paypalUrl){e.preventDefault();return}paypalButton.href=paypalUrl});
loadBoard(new URLSearchParams(location.search).get('s')||'');
</script></body></html>
