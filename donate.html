<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Synagogue Donation</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #19447f,
      #071f50 55%,
      #020b1d
    );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;
}


.card{

  width:min(
    720px,
    96vw
  );

  background:#071f50;

  border:
    3px solid #d7a62d;

  border-radius:24px;

  padding:30px;

  box-shadow:
    0 8px 30px #0008;

  text-align:center;

}


.heart{

  font-size:48px;

  margin-bottom:8px;

}


h1{

  color:#f6d469;

  margin:
    0 0 12px;

  font-size:31px;

}


.synagogueTitle{

  font-size:22px;

  font-weight:900;

  margin-bottom:6px;

}


.synagogueNumber{

  color:#f6d469;

  font-size:17px;

  font-weight:900;

  margin-bottom:18px;

}


.description{

  color:#e7edff;

  line-height:1.6;

  margin-bottom:22px;

}


.infoBox{

  background:#fff8df;

  color:#07152d;

  border:
    2px solid #d7a62d;

  border-radius:14px;

  padding:14px;

  margin-bottom:14px;

  text-align:left;

}


.infoLabel{

  font-size:12px;

  font-weight:900;

  color:#76520e;

  margin-bottom:5px;

}


.infoValue{

  font-size:17px;

  font-weight:900;

}


.memberDetails{

  margin-top:7px;

  font-size:13px;

  font-weight:700;

  color:#42516c;

  line-height:1.5;

}


.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-top:15px;

}


label{

  text-align:left;

  font-weight:800;

  font-size:13px;

}


input,
select,
textarea{

  width:100%;

  margin-top:6px;

  padding:12px;

  border:
    2px solid #d7a62d;

  border-radius:10px;

  background:#fff;

  color:#111;

  font-size:15px;

}


input[readonly]{

  background:#edf4ff;

  color:#0b2f72;

  font-weight:900;

}


textarea{

  min-height:100px;

  resize:vertical;

}


.wide{

  grid-column:
    1 / -1;

}


.amountButtons{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:8px;

  margin-top:7px;

}


.amountBtn{

  border:
    2px solid #d7a62d;

  border-radius:10px;

  background:#fff8df;

  color:#07152d;

  padding:
    11px 6px;

  font-weight:900;

  cursor:pointer;

}


.amountBtn:hover{

  background:#f6d469;

}


.amountBtn.selected{

  background:#d7a62d;

  color:#07152d;

}


.paySection{

  margin-top:25px;

  padding-top:20px;

  border-top:
    1px solid #d7a62d66;

}


.payTitle{

  color:#f6d469;

  font-size:20px;

  font-weight:900;

  margin-bottom:12px;

}


#paypal-button-container{

  width:100%;

  max-width:520px;

  margin:
    0 auto;

}


.msg{

  min-height:25px;

  margin-top:16px;

  font-weight:900;

  line-height:1.5;

}


.error{

  color:#ffaaaa;

}


.success{

  color:#9cffaa;

}


.loading{

  color:#f6d469;

}


.receipt{

  display:none;

  margin-top:20px;

  background:#e9fff0;

  border:
    3px solid #31a45b;

  border-radius:14px;

  padding:18px;

  color:#075326;

  text-align:left;

}


.receipt h2{

  text-align:center;

  margin:
    0 0 14px;

  color:#087231;

}


.receiptRow{

  padding:
    5px 0;

  border-bottom:
    1px solid #9edab5;

}


.backRow{

  margin-top:18px;

  display:flex;

  justify-content:center;

  gap:8px;

  flex-wrap:wrap;

}


.backBtn{

  text-decoration:none;

  background:#164b8f;

  color:#fff;

  border-radius:9px;

  padding:
    10px 14px;

  font-weight:800;

  font-size:13px;

}


@media(
  max-width:650px
){

  .grid{

    grid-template-columns:1fr;

  }


  .wide{

    grid-column:auto;

  }


  .amountButtons{

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }


  .card{

    padding:20px;

  }

}

</style>

</head>


<body>


<div class="card">


  <div class="heart">
    💛
  </div>


  <h1>
    Secure Synagogue Donation
  </h1>


  <div
    id="synagogueTitle"
    class="synagogueTitle"
  >
    Loading synagogue...
  </div>


  <div
    id="synagogueNumber"
    class="synagogueNumber"
  ></div>


  <div class="description">

    Your donation will be securely processed through PayPal.

  </div>



  <!-- SYNAGOGUE -->

  <div class="infoBox">


    <div class="infoLabel">
      Synagogue
    </div>


    <div
      id="synagogueDisplay"
      class="infoValue"
    >
      Loading...
    </div>


  </div>



  <!-- MEMBER -->

  <div
    id="memberBox"
    class="infoBox"
    style="display:none"
  >


    <div class="infoLabel">
      Member
    </div>


    <div
      id="memberDisplay"
      class="infoValue"
    ></div>


    <div
      id="memberDetails"
      class="memberDetails"
    ></div>


  </div>



  <!-- DONATION FORM -->

  <div class="grid">


    <label>

      Donor name

      <input
        id="donorName"
        autocomplete="name"
      >

    </label>



    <label>

      Donor email

      <input
        id="donorEmail"
        type="email"
        autocomplete="email"
      >

    </label>



    <label class="wide">

      Donation purpose

      <select id="purpose">


        <option value="General Donation">
          General Donation
        </option>


        <option value="Tzedakah">
          Tzedakah
        </option>


        <option value="Kiddush">
          Kiddush
        </option>


        <option value="Yahrzeit">
          Yahrzeit
        </option>


        <option value="Building Fund">
          Building Fund
        </option>


        <option value="Torah">
          Torah
        </option>


        <option value="Tree / Landscaping">
          Tree / Landscaping
        </option>


        <option value="Other">
          Other
        </option>


      </select>

    </label>



    <label class="wide">

      Donation amount


      <div class="amountButtons">


        <button
          class="amountBtn"
          type="button"
          onclick="setAmount(18,this)"
        >
          $18
        </button>


        <button
          class="amountBtn"
          type="button"
          onclick="setAmount(36,this)"
        >
          $36
        </button>


        <button
          class="amountBtn"
          type="button"
          onclick="setAmount(72,this)"
        >
          $72
        </button>


        <button
          class="amountBtn"
          type="button"
          onclick="setAmount(180,this)"
        >
          $180
        </button>


      </div>


      <input
        id="amount"
        type="number"
        min="1"
        step="0.01"
        placeholder="Enter custom amount"
      >


    </label>



    <label class="wide">

      Dedication / message

      <textarea
        id="dedication"
        placeholder="Optional dedication, yahrzeit name, blessing or message..."
      ></textarea>

    </label>


  </div>



  <!-- PAYPAL -->

  <div class="paySection">


    <div class="payTitle">
      Choose PayPal to Donate
    </div>


    <div
      id="paypal-button-container"
    ></div>


  </div>



  <div
    id="msg"
    class="msg loading"
  >
    Loading donation information...
  </div>



  <!-- SUCCESS RECEIPT -->

  <div
    id="receipt"
    class="receipt"
  >


    <h2>
      ✓ Donation Successful
    </h2>


    <div class="receiptRow">

      <strong>
        Synagogue:
      </strong>

      <span id="receiptSynagogue">
      </span>

    </div>


    <div class="receiptRow">

      <strong>
        Member:
      </strong>

      <span id="receiptMember">
      </span>

    </div>


    <div class="receiptRow">

      <strong>
        Donor:
      </strong>

      <span id="receiptDonor">
      </span>

    </div>


    <div class="receiptRow">

      <strong>
        Amount:
      </strong>

      <span id="receiptAmount">
      </span>

    </div>


    <div class="receiptRow">

      <strong>
        PayPal Transaction:
      </strong>

      <span id="receiptTransaction">
      </span>

    </div>


  </div>



  <div class="backRow">


    <a
      class="backBtn"
      href="members.html"
    >
      👥 Members
    </a>


    <a
      id="boardLink"
      class="backBtn"
      href="index.html"
    >
      📺 Board
    </a>


  </div>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


<script src="supabase-config.js"></script>


<script src="saas-common.js"></script>



<!-- PAYPAL LIVE SDK -->

<script
  src="https://www.paypal.com/sdk/js?client-id=AZD0NtTugRgLzVbjLm9jtprCTer2z7-r3VMjSnrLaU3Ms1VJso-50DMmDBmMpdMioEhUUVMfB-4T7lRe&currency=USD&intent=capture"
></script>



<script>


let sb=null;


let synagogueRecord=null;


let memberRecord=null;


let memberNumber="";


let paypalRendered=false;



/* =========================================
   URL
========================================= */


function getURLInfo(){


  const params=
    new URLSearchParams(
      window.location.search
    );


  return{


    synagogue:
      (
        params.get(
          "synagogue"
        )
        ||
        params.get(
          "s"
        )
        ||
        params.get(
          "slug"
        )
        ||
        ""
      ).trim(),


    member:
      (
        params.get(
          "member"
        )
        ||
        ""
      ).trim()


  };


}



/* =========================================
   ESCAPE HTML
========================================= */


function esc(value){


  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    character=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#39;"

    }[character])
  );


}



/* =========================================
   AMOUNT
========================================= */


function setAmount(
  amount,
  button
){


  document
    .getElementById(
      "amount"
    )
    .value=
      amount;


  document
    .querySelectorAll(
      ".amountBtn"
    )
    .forEach(
      b=>
        b.classList.remove(
          "selected"
        )
    );


  if(button){

    button
      .classList
      .add(
        "selected"
      );

  }


}



/* =========================================
   LOAD SYNAGOGUE
========================================= */


async function loadSynagogue(){


  const info=
    getURLInfo();


  if(
    !info.synagogue
  ){

    throw new Error(
      "Synagogue number is missing."
    );

  }


  memberNumber=
    info.member;


  const {
    data,
    error
  }=
    await sb.rpc(
      "get_synagogue_for_registration",
      {

        p_slug:
          info.synagogue

      }
    );


  if(error){

    throw error;

  }


  const synagogue=
    Array.isArray(
      data
    )
      ?
      data[0]
      :
      data;


  if(
    !synagogue
  ){

    throw new Error(
      "Synagogue not found."
    );

  }


  synagogueRecord=
    synagogue;


  const name=
    synagogue.synagogue_name
    ||
    "Synagogue";


  const slug=
    synagogue.slug
    ||
    info.synagogue;


  document
    .getElementById(
      "synagogueTitle"
    )
    .textContent=
      name;


  document
    .getElementById(
      "synagogueNumber"
    )
    .textContent=
      "Synagogue #"
      +
      slug;


  document
    .getElementById(
      "synagogueDisplay"
    )
    .textContent=
      slug
      +
      " — "
      +
      name;


  document
    .getElementById(
      "boardLink"
    )
    .href=
      "index.html?s="
      +
      encodeURIComponent(
        slug
      );


  if(
    memberNumber
  ){


    document
      .getElementById(
        "memberBox"
      )
      .style.display=
        "block";


    document
      .getElementById(
        "memberDisplay"
      )
      .textContent=
        memberNumber;


  }


}



/* =========================================
   LOAD MEMBER
========================================= */


async function loadMember(){


  if(
    !memberNumber
  ){

    return;

  }


  const {
    data,
    error
  }=
    await sb.rpc(
      "get_my_synagogue_members"
    );


  if(error){

    console.error(
      error
    );

    throw new Error(
      "Unable to load member information."
    );

  }


  const members=
    Array.isArray(
      data
    )
      ?
      data
      :
      [];


  const member=
    members.find(
      m=>
        String(
          m.member_number
          ||
          ""
        )
        ===
        String(
          memberNumber
        )
    );


  if(
    !member
  ){

    throw new Error(
      "Member "
      +
      memberNumber
      +
      " was not found."
    );

  }


  memberRecord=
    member;



  document
    .getElementById(
      "donorName"
    )
    .value=
      member.full_name
      ||
      "";



  document
    .getElementById(
      "donorEmail"
    )
    .value=
      member.email
      ||
      "";



  document
    .getElementById(
      "donorName"
    )
    .readOnly=
      true;



  document
    .getElementById(
      "donorEmail"
    )
    .readOnly=
      true;



  const details=[];


  if(
    member.full_name
  ){

    details.push(
      member.full_name
    );

  }


  if(
    member.email
  ){

    details.push(
      member.email
    );

  }


  if(
    member.phone
  ){

    details.push(
      member.phone
    );

  }


  document
    .getElementById(
      "memberDetails"
    )
    .innerHTML=
      details
      .map(
        esc
      )
      .join(
        " &nbsp; • &nbsp; "
      );


}



/* =========================================
   VALIDATE DONATION
========================================= */


function getDonationForm(){


  const amount=
    Number(
      document
        .getElementById(
          "amount"
        )
        .value
    );


  const donorName=
    document
      .getElementById(
        "donorName"
      )
      .value
      .trim();


  const donorEmail=
    document
      .getElementById(
        "donorEmail"
      )
      .value
      .trim();


  const purpose=
    document
      .getElementById(
        "purpose"
      )
      .value;


  const dedication=
    document
      .getElementById(
        "dedication"
      )
      .value
      .trim();


  if(
    !Number.isFinite(
      amount
    )
    ||
    amount <= 0
  ){

    throw new Error(
      "Please enter a donation amount."
    );

  }


  if(
    !donorName
  ){

    throw new Error(
      "Donor name is required."
    );

  }


  if(
    !donorEmail
  ){

    throw new Error(
      "Donor email is required."
    );

  }


  return{

    amount,

    donorName,

    donorEmail,

    purpose,

    dedication

  };


}



/* =========================================
   PAYPAL BUTTON
========================================= */


function renderPayPal(){


  if(
    paypalRendered
  ){

    return;

  }


  if(
    typeof paypal ===
    "undefined"
  ){

    throw new Error(
      "PayPal checkout could not load."
    );

  }


  paypalRendered=
    true;



  paypal
    .Buttons({



      style:{

        layout:
          "vertical",

        shape:
          "rect",

        label:
          "paypal",

        height:
          48

      },



      /* ===================================
         CREATE ORDER
      =================================== */


      createOrder:
        async function(){


          const msg=
            document.getElementById(
              "msg"
            );


          try{


            if(
              !synagogueRecord
            ){

              throw new Error(
                "Synagogue information has not loaded."
              );

            }


            const donation=
              getDonationForm();


            msg.textContent=
              "Creating secure PayPal order...";


            msg.className=
              "msg loading";



            const {
              data,
              error
            }=
              await sb.functions.invoke(
                "paypal-donation",
                {

                  body:{

                    action:
                      "create",

                    synagogue_slug:
                      synagogueRecord.slug,

                    member_number:
                      memberNumber
                      ||
                      null,

                    amount:
                      donation.amount,

                    purpose:
                      donation.purpose,

                    dedication:
                      donation.dedication
                      ||
                      null,

                    donor_name:
                      donation.donorName,

                    donor_email:
                      donation.donorEmail

                  }

                }
              );



            if(error){

              throw error;

            }



            if(
              !data
              ||
              !data.orderID
            ){

              throw new Error(
                data?.error
                ||
                "PayPal order could not be created."
              );

            }



            sessionStorage.setItem(
              "paypal_donation_order_id",
              data.orderID
            );


            msg.textContent=
              "PayPal order created. Please approve the payment.";


            msg.className=
              "msg success";


            return data.orderID;


          }
          catch(error){


            console.error(
              "PayPal create error:",
              error
            );


            msg.textContent=
              error.message
              ||
              String(error);


            msg.className=
              "msg error";


            throw error;


          }


        },



      /* ===================================
         APPROVE + CAPTURE
      =================================== */


      onApprove:
        async function(data){


          const msg=
            document.getElementById(
              "msg"
            );


          try{


            msg.textContent=
              "Payment approved. Completing donation...";


            msg.className=
              "msg loading";



            const {
              data:
                captureResult,

              error
            }=
              await sb.functions.invoke(
                "paypal-donation",
                {

                  body:{

                    action:
                      "capture",

                    orderID:
                      data.orderID

                  }

                }
              );



            if(error){

              throw error;

            }



            if(
              !captureResult
              ||
              captureResult.status
              !==
              "COMPLETED"
            ){

              throw new Error(
                captureResult?.error
                ||
                "PayPal payment was not completed."
              );

            }



            const donation=
              getDonationForm();



            msg.textContent=
              "✓ Donation completed successfully!";


            msg.className=
              "msg success";



            document
              .getElementById(
                "receiptSynagogue"
              )
              .textContent=
                synagogueRecord.slug
                +
                " — "
                +
                synagogueRecord.synagogue_name;



            document
              .getElementById(
                "receiptMember"
              )
              .textContent=
                memberNumber
                ||
                "Guest";



            document
              .getElementById(
                "receiptDonor"
              )
              .textContent=
                donation.donorName;



            document
              .getElementById(
                "receiptAmount"
              )
              .textContent=
                "$"
                +
                Number(
                  donation.amount
                )
                .toFixed(
                  2
                );



            document
              .getElementById(
                "receiptTransaction"
              )
              .textContent=
                captureResult.transactionID
                ||
                data.orderID;



            document
              .getElementById(
                "receipt"
              )
              .style.display=
                "block";



            document
              .getElementById(
                "paypal-button-container"
              )
              .style.display=
                "none";



          }
          catch(error){


            console.error(
              "PayPal capture error:",
              error
            );


            msg.textContent=
              error.message
              ||
              String(error);


            msg.className=
              "msg error";


          }


        },



      /* ===================================
         CANCEL
      =================================== */


      onCancel:
        function(){


          const msg=
            document.getElementById(
              "msg"
            );


          msg.textContent=
            "PayPal payment was cancelled. No donation was charged.";


          msg.className=
            "msg error";


        },



      /* ===================================
         PAYPAL ERROR
      =================================== */


      onError:
        function(error){


          console.error(
            "PayPal button error:",
            error
          );


          const msg=
            document.getElementById(
              "msg"
            );


          msg.textContent=
            "PayPal encountered an error. Please try again.";


          msg.className=
            "msg error";


        }


    })
    .render(
      "#paypal-button-container"
    );


}



/* =========================================
   INITIALIZE
========================================= */


async function initializeDonationPage(){


  const msg=
    document.getElementById(
      "msg"
    );


  try{


    sb=
      getSupabase();


    msg.textContent=
      "Loading synagogue...";


    msg.className=
      "msg loading";



    await loadSynagogue();



    if(
      memberNumber
    ){


      msg.textContent=
        "Loading member "
        +
        memberNumber
        +
        "...";


      await loadMember();


    }



    renderPayPal();



    if(
      memberRecord
    ){


      msg.textContent=
        "Member "
        +
        memberRecord.member_number
        +
        " loaded — choose an amount and use PayPal below.";


    }
    else{


      msg.textContent=
        "Choose an amount and use PayPal below.";


    }


    msg.className=
      "msg success";


  }
  catch(error){


    console.error(
      error
    );


    msg.textContent=
      error.message
      ||
      String(error);


    msg.className=
      "msg error";


  }


}



window.addEventListener(
  "DOMContentLoaded",
  initializeDonationPage
);


</script>


</body>
</html>
