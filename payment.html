<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPal Subscription</title>
</head>

<body>

  <script src="https://www.paypal.com/sdk/js?client-id=AZD0NtTugRgLzVbjLm9jtprCTer2z7-r3VMjSnrLaU3Ms1VJso-50DMmDBmMpdMioEhUUVMfB-4T7lRe&vault=true&intent=subscription"></script>

  <div id="paypal-button-container"></div>

  <script>
    paypal.Buttons({

      createSubscription: function(data, actions) {
        return actions.subscription.create({
          plan_id: "P-03H97087WB697233KNKK4D2A"
        });
      },

      onApprove: function(data, actions) {
        alert(
          "You have successfully subscribed to " +
          data.subscriptionID
        );
      }

    }).render("#paypal-button-container");
  </script>

</body>
</html>
