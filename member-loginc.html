<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Member Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#194b85,#07172e 55%,#020711);font-family:Arial,sans-serif;color:#fff}.card{width:min(610px,96vw);background:#0a1c35;border:3px solid #d7a62d;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0009}h1{text-align:center;color:#f8d66b;margin:0 0 6px}.muted{text-align:center;color:#d8e2f4}.grid{display:grid;gap:14px;margin-top:20px}label{font-weight:900}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d7a62d;border-radius:10px;font-size:16px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn,button{border:0;border-radius:11px;padding:12px 18px;background:#ffc439;color:#111;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#fff;color:#09204c}.msg{text-align:center;min-height:25px;margin-top:14px;font-weight:800;color:#ffd873}</style></head>
<body><main class="card"><h1>Church Member Login</h1><p class="muted">Your personal congregation account</p><div class="grid"><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label></div><div class="actions"><button onclick="loginMember()">Login</button><a id="registerLink" class="btn secondary" href="member-registerc.html">Register</a><a id="boardLink" class="btn secondary" href="indexc.html">Back to Board</a></div><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script><script>
const requestedSlug=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();if(requestedSlug){const q='?s='+encodeURIComponent(requestedSlug);registerLink.href='member-registerc.html'+q;boardLink.href='indexc.html'+q}
async function loginMember(){msg.textContent='Signing in…';try{const sb=getSupabase();const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;const {data:m,error:me}=await sb.from('organization_members').select('organization_slug,status').eq('user_id',data.user.id).maybeSingle();if(me)throw me;if(!m)throw new Error('This is not a church member account.');if(m.status!=='active')throw new Error('This member account is suspended. Please contact the church.');location.href='donatec.html?s='+encodeURIComponent(m.organization_slug)}catch(e){msg.textContent=e.message||String(e)}}
</script></body></html>
