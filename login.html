<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.sb=supabase.createClient("https://chcfhxkggbrlxaopnfum.supabase.co","sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D");</script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif}body{background:#07163c;color:#241d11;padding:18px}.wrap{max-width:1100px;margin:auto;background:#fff8df;border:4px solid #d7a62d;border-radius:24px;padding:20px;box-shadow:0 18px 55px #0007}h1,h2{color:#0b1c4b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:2px solid #d9bd6a;border-radius:15px;padding:14px;margin:12px 0}label{display:block;font-weight:800;margin:10px 0}input,select,textarea{width:100%;padding:11px;border:2px solid #cfad55;border-radius:10px;font:inherit}.btn,button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#0b1c4b;color:#fff}.good{background:#16843f;color:#fff}.warn{background:#c47d00;color:#fff}.bad{background:#a92323;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:900;min-height:25px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap" style="max-width:520px"><h1>🔐 כניסה למערכת</h1><p>Master Admin • Synagogue Owner • Member</p><form id="f"><label>אימייל<input id="email" type="email" required></label><label>סיסמה<input id="password" type="password" minlength="6" required></label><button class="btn primary" style="width:100%">LOGIN</button></form><div id="st" class="status"></div><div class="actions"><a class="btn good" href="member-register.html">הרשמת חבר</a><a class="btn primary" href="index.html?stay=1">ללוח</a></div></main><script>
async function route(u){const{data:p,error}=await sb.from('app_profiles').select('role,status,synagogue_id').eq('user_id',u.id).single();if(error||!p)throw Error('No app profile assigned.');if(p.status!=='approved')throw Error('Account waiting for approval.');if(p.role==='master_admin')location.replace('master-admin.html');else if(p.role==='synagogue_owner')location.replace('synagogue-admin.html');else if(p.role==='member')location.replace('member-portal.html');}
f.onsubmit=async e=>{e.preventDefault();st.textContent='מתחבר...';const{data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return st.textContent='⚠ '+error.message;try{await route(data.user)}catch(x){st.textContent='⚠ '+x.message}};
</script></body></html>
