<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mb-build" content="new-marble-board-v2-supabase-prayers">
<title>לוח בית הכנסת</title>

<style>
:root{--navy:#101b43;--navy2:#17285e;--gold:#c79b43;--gold2:#f0d48a;--ink:#33240f;--cream:#fffaf0;--line:#b98a36}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}

.board{
position:fixed;inset:0;overflow:hidden;padding:1.1vh 1vw;
background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(232,225,208,.95)),
repeating-linear-gradient(105deg,transparent 0 35px,rgba(135,116,80,.07) 36px 37px);
border:clamp(4px,.55vw,10px) ridge var(--gold);
display:grid;grid-template-rows:10vh minmax(0,1fr) 5.5vh;gap:.8vh
}

.topbar{direction:ltr;display:grid;grid-template-columns:minmax(235px,19vw) 1fr minmax(235px,19vw);gap:.8vw;min-height:0}

.clockbox,.titlebox,.panel,.center-stage{
border:clamp(2px,.25vw,5px) ridge var(--gold);
box-shadow:inset 0 0 0 2px #fff8d5,0 2px 9px #66512c66
}

.clockbox{
direction:ltr;background:linear-gradient(180deg,var(--navy2),#0b1431);
color:#fff;border-radius:18px;display:flex;align-items:center;
justify-content:center;gap:.7vw;padding:.4vh .7vw;overflow:hidden
}

.clock-city{font-weight:1000;color:var(--gold2);font-size:clamp(13px,1vw,20px);line-height:1.1}
.clock-time{font-weight:1000;font-size:clamp(29px,2.55vw,52px);line-height:1;white-space:nowrap;letter-spacing:-2px;font-variant-numeric:tabular-nums}

.titlebox{
direction:rtl;border-radius:20px;background:linear-gradient(#fffdf7,#e8dec8);
display:flex;flex-direction:column;justify-content:center;align-items:center;
min-width:0;padding:.2vh .8vw
}

.synagogue{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,2.5vw,50px);font-weight:1000;color:var(--navy);line-height:1.05;text-align:center}
.rabbi{font-size:clamp(15px,1.25vw,25px);font-weight:1000;color:#7a5519;margin-top:.25vh}
.date-line{font-size:clamp(12px,.9vw,18px);font-weight:900;color:#3e3222;margin-top:.15vh}

.main-grid{
direction:ltr;display:grid;
grid-template-columns:minmax(220px,20%) minmax(500px,60%) minmax(220px,20%);
gap:.8vw;min-height:0;overflow:hidden
}

.side{direction:rtl;display:grid;grid-template-rows:minmax(0,1.75fr) minmax(0,.75fr);gap:.8vh;min-height:0}

.panel{
position:relative;min-height:0;overflow:hidden;
background:linear-gradient(180deg,#fffdf4,#f1e5c4);
border-radius:130px 130px 12px 12px;padding:5.2vh 1vw 1vh
}

.panel:before{
content:"";position:absolute;inset:1.2vh .7vw auto;height:8.2vh;
border-radius:90px 90px 20px 20px;
background:radial-gradient(circle at 50% 0,#f2d783,#ba8b35 65%,#6b491b);
border:3px ridge var(--gold);z-index:0
}

.panel-title{
position:absolute;top:4.7vh;left:12%;right:12%;z-index:1;text-align:center;
border-radius:999px;padding:.45vh .5vw;
background:linear-gradient(#ffe9a8,#bd8a37);
border:2px solid #8c6428;font-size:clamp(17px,1.35vw,27px);
font-weight:1000;color:#4a3210;white-space:nowrap
}

.rows{height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding-top:2vh}

.data-row{
display:flex;justify-content:space-between;align-items:center;gap:.6vw;
border-bottom:1px dotted #9c7e4a;padding:clamp(2px,.36vh,6px) .25vw;
font-size:clamp(13px,1.02vw,20px);font-weight:1000;line-height:1.07;color:#241a0d
}

.data-row strong{font-variant-numeric:tabular-nums;color:#111;white-space:nowrap}
.data-row.highlight strong{color:#9e160f}

.small-panel{border-radius:12px;padding:5.4vh 1vw .8vh}
.small-panel:before{height:6.8vh;border-radius:18px;inset:.7vh .7vw auto}
.small-panel .panel-title{top:2.3vh}

.notice{
height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
font-size:clamp(15px,1.15vw,23px);font-weight:1000;line-height:1.3;
white-space:pre-line;overflow:hidden
}

.center-stage{
position:relative;min-width:0;min-height:0;overflow:hidden;
border-radius:170px 170px 18px 18px;
background:linear-gradient(180deg,var(--navy) 0 24%,#f8e8b6 24% 82%,var(--navy) 82%);
padding:6.5vh 2.2vw 4vh
}

.center-stage:before{
content:"";position:absolute;top:1.2vh;left:50%;transform:translateX(-50%);
width:clamp(72px,6vw,120px);aspect-ratio:1;border-radius:50%;
border:5px ridge var(--gold);background:radial-gradient(circle,#263c7a,#111c45);
box-shadow:0 0 0 8px #e6c875
}

.center-heading{
position:absolute;top:10.4vh;left:4%;right:4%;text-align:center;
color:var(--gold2);font-family:Georgia,"Times New Roman",serif;
font-size:clamp(24px,2.4vw,48px);font-weight:1000;text-shadow:0 2px #000
}

.parchment{
position:relative;height:100%;border:6px double #9c762f;
border-radius:10% 10% 14% 14%;
background:radial-gradient(circle at 50% 25%,#fffdf6,#f6e8bd 72%,#d5b871);
box-shadow:inset 0 0 34px #8d67273d;
display:flex;flex-direction:column;align-items:center;text-align:center;
padding:1.2vh 1.2vw 1vh;overflow:hidden
}

.parchment h1{margin:0 0 1vh;font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,2.5vw,50px);color:#5c4115}
.parchment h2{margin:.25vh 0 .7vh;font-size:clamp(24px,2.15vw,42px);color:var(--navy);font-weight:1000}

.main-message{
position:relative;width:96%;flex:1;min-height:0;overflow:hidden;
font-size:clamp(20px,1.75vw,34px);line-height:1.55;font-weight:1000
}

.main-message-scroll{
position:absolute;left:0;right:0;top:0;white-space:pre-line;
animation:centerTextScroll var(--center-scroll-duration,85s) linear infinite;
will-change:transform
}

.main-message-line{
display:block;min-height:1.55em;
animation:centerLineColors 20s linear infinite;
animation-delay:calc(var(--center-line-index,0) * -2.2s)
}

@keyframes centerTextScroll{from{transform:translateY(100%)}to{transform:translateY(-100%)}}
@keyframes centerLineColors{
0%,100%{color:#3d2a10}
20%{color:#0f3f8c}
40%{color:#8b1d3b}
60%{color:#146b44}
80%{color:#6f3a9c}
}

.dedication{
margin-top:1vh;padding:.65vh 1vw;border:2px solid var(--gold);
border-radius:10px;font-size:clamp(14px,1.05vw,21px);font-weight:1000;
color:#5c3c0b;background:#fff7d5cc
}

.liturgy-box{
width:96%;margin:.8vh auto 0;padding:.7vh .8vw;border:2px solid #b98a36;
border-radius:12px;background:#fffdf3d9;color:#17224d;
font-size:clamp(12px,.9vw,18px);font-weight:1000;line-height:1.35;
max-height:27%;overflow:hidden;display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));gap:.25vh .7vw;text-align:right
}

.liturgy-item{border-bottom:1px dotted #b89754;padding:.1vh .15vw}
.liturgy-item strong{color:#7b4813}
.liturgy-alert{color:#9e160f}
.calendar-note{grid-column:1/-1;text-align:center;color:#6b4b14;font-size:.88em}

.bottom-ticker{
direction:ltr;border:3px ridge var(--gold);border-radius:10px;
background:linear-gradient(180deg,var(--navy2),#0a1230);
overflow:hidden;display:flex;align-items:center;color:#fff6ba;
font-weight:1000;font-size:clamp(17px,1.5vw,29px);white-space:nowrap
}

.ticker-text{display:inline-block;min-width:100%;text-align:center;animation:ticker 18s linear infinite}
@keyframes ticker{from{transform:translateX(-105%)}to{transform:translateX(105%)}}

.gear{
position:fixed;z-index:100000;top:1.7vh;right:1.5vw;
width:clamp(46px,3.2vw,64px);aspect-ratio:1;border-radius:50%;
border:3px solid var(--gold2);background:var(--navy);color:#fff;
font-size:clamp(24px,2vw,38px);display:grid;place-items:center;
cursor:pointer;box-shadow:0 2px 12px #0008
}

dialog{
width:min(1180px,96vw);max-height:92vh;border:5px ridge var(--gold);
border-radius:18px;background:#101a3b;color:#fff;padding:0;overflow:auto
}
dialog::backdrop{background:#000b}

.admin-head{
position:sticky;top:0;z-index:3;background:#0a1230;
border-bottom:2px solid var(--gold);padding:12px 18px;
display:flex;align-items:center;justify-content:space-between;gap:12px
}
.admin-head h2{margin:0;color:var(--gold2)}
.admin-body{padding:14px;display:grid;gap:14px}
.admin-section{border:2px solid #9d7938;border-radius:12px;padding:12px;background:#17234c}
.admin-section h3{margin:0 0 10px;color:#ffe298}

.fast-panel{border-color:#9e2f2f;background:linear-gradient(180deg,#2b1720,#17172b)}
.fast-panel .panel-title{color:#ffd36a}
.fast-info{font-weight:900;line-height:1.45;text-align:center;padding:.7vh .4vw}
.fast-name{font-size:clamp(18px,1.5vw,29px);color:#ffd36a;margin-bottom:.45vh}
.fast-time-row{display:flex;justify-content:space-between;gap:.5rem;border-top:1px dotted #ffffff55;padding:.35vh .15vw;color:#fff}
.fast-note{font-size:.78em;color:#f4dfb3;margin-top:.35vh}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-weight:900;color:#fff}

input,select,textarea{
width:100%;border:1px solid #c9a85c;border-radius:7px;
background:#fff;color:#111;padding:8px
}

textarea{resize:vertical;min-height:85px}

.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.action{border:2px solid var(--gold);background:#f7df98;color:#2e210c;border-radius:9px;padding:8px 14px;font-weight:1000;cursor:pointer}
.close{background:#7c1d1d;color:#fff}
.status{text-align:center;color:#9cff6b;font-weight:1000;min-height:20px}

.speed-scale{
display:flex;direction:ltr;justify-content:space-between;align-items:center;
gap:10px;color:#ffe7a0;font-weight:1000
}
.speed-scale strong{
min-width:54px;text-align:center;border:1px solid var(--gold);
border-radius:999px;padding:3px 8px;background:#0a1230;color:#fff
}

/* PRAYER OVERLAY */

.overlay{
position:fixed;inset:0;z-index:90000;
background:radial-gradient(circle at 50% 20%,#17285e,#050a1d 68%,#000);
color:#fff;display:none;align-items:flex-start;justify-content:center;
padding:0 7vw;text-align:center;overflow:hidden
}

.overlay.active{display:flex}
