<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Admin</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Hebrew",sans-serif;
  background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);
  color:#fff;
  padding:22px;
}
.card{
  width:min(1450px,98vw);
  margin:auto;
  background:linear-gradient(180deg,#0b2b5d,#061a3b);
  border:3px solid #d7a62d;
  border-radius:24px;
  box-shadow:0 20px 60px #0008,inset 0 0 0 2px #fff2a633;
  padding:24px;
}
h1{color:#f6d469;text-align:center;margin:0 0 8px}
.muted{color:#d8dfef;text-align:center;margin:0 0 16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
button,.btn{
  display:inline-block;border:0;border-radius:10px;padding:10px 13px;
  background:#d7a62d;color:#07152d;font-weight:900;cursor:pointer;
  text-decoration:none;font-size:14px
}
.secondary{background:#fff;color:#07152d}
.success{background:#2f9d57;color:#fff}
.danger{background:#b51f26;color:#fff}
.info{background:#2b73d2;color:#fff}
.msg{min-height:26px;text-align:center;font-weight:800;margin:10px 0}
.member{
  background:#fff;color:#111;border-radius:16px;margin:16px 0;
  overflow:hidden;border:2px solid #d7a62d
}
.memberHead{
  display:flex;justify-content:space-between;gap:14px;align-items:center;
  background:#f2df9c;padding:14px 16px;flex-wrap:wrap
}
.name{font-size:20px;font-weight:900;color:#07152d}
.number{
  display:inline-block;background:#07152d;color:#fff;border-radius:999px;
  padding:5px 10px;font-size:13px;font-weight:900;margin-right:8px
}
.pill{
  display:inline-block;padding:5px 9px;border-radius:999px;
  background:#e7e7e7;font-weight:800;font-size:12px
}
.details{
  display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));
  gap:0;border-top:1px solid #ddd
}
.details>div{padding:12px 14px;border-right:1px solid #e1e1e1;border-bottom:1px solid #e1e1e1;min-height:70px}
.details b{display:block;color:#6b4f0b;font-size:12px;text-transform:uppercase;margin-bottom:5px}
.memberActions{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
.price{width:100px;padding:8px;border:1px solid #aaa;border-radius:8px}
.loginBlock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:#666}
@media(max-width:1050px){.details{grid-template-columns:repeat(2,minmax(180px,1fr))}}
@media(max-width:620px){
  body{padding:8px}.card{padding:12px}.details{grid-template-columns:1fr}
  .memberHead{align-items:flex-start}.memberActions{flex-direction:column}
  .memberActions button,.memberActions .btn{width:100%}
}
</style>
</head>
<body>

<div class="card">
  <h1>Master Admin</h1>
  <p class="muted">Full synagogue owner information, approval, access control, pricing and password reset.</p>

  <div class="actions">
    <button onclick="loadMembers()">Refresh</button>
    <button class="secondary" onclick="logoutApp()">Logout</button>
  </div>

  <div id="msg" class="msg"></div>
  <div id="rows"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://chcfhxkggbrlxaopnfum.supabase.co";
const SUPABASE_KEY = "sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    storageKey: "synagogue-master-admin-auth"
  }
});

function esc(x){
  return String(x ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function val(x){ return x ? esc(x) : "—"; }

function daysLeft(end){
  if(!end) return null;
  const ms = new Date(end).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / 86400000));
}

async function guard(){
  const {data:{session},error:sessionError} = await sb.auth.getSession();

  if(sessionError || !session){
    location.replace("master-login.html");
    return false;
  }

  const {data:p,error:profileError} = await sb
    .from("app_profiles")
    .select("role,status")
    .eq("user_id",session.user.id)
    .maybeSingle();

  if(profileError || !p){
    await sb.auth.signOut({scope:"local"});
    location.replace("master-login.html");
    return false;
  }

  const role = String(p.role || "").toLowerCase();
  const status = String(p.status || "").toLowerCase();

  if(role !== "master_admin" || status !== "approved"){
    await sb.auth.signOut({scope:"local"});
    location.replace("master-login.html");
    return false;
  }
  return true;
}

async function logoutApp(){
  await sb.auth.signOut({scope:"local"});
  location.replace("master-login.html");
}

async function loadMembers(){
  if(!(await guard())) return;

  msg.textContent = "Loading synagogue members...";

  const selectWithFullProfile =
    "*,profiles!synagogues_owner_user_id_fkey(email,full_name,phone,street_address,city,state_region,postal_code,country,member_id)";

  let result = await sb
    .from("synagogues")
    .select(selectWithFullProfile)
    .order("synagogue_number",{ascending:true});

  /* Fallback for older database versions that do not yet have all profile columns. */
  if(result.error){
    result = await sb
      .from("synagogues")
      .select("*,profiles!synagogues_owner_user_id_fkey(email,full_name,phone)")
      .order("synagogue_number",{ascending:true});
  }

  const {data,error} = result;

  if(error){
    msg.textContent = "Error: " + error.message;
    return;
  }

  const list = data || [];

  rows.innerHTML = list.map(s=>{
    const p = s.profiles || {};
    const left = s.status === "trial" ? daysLeft(s.trial_ends_at) : null;
    const shownStatus = (s.status === "trial" && left === 0) ? "expired" : (s.status || "pending");

    const address = [
      p.street_address,
      p.city,
      p.state_region,
      p.postal_code,
      p.country
    ].filter(Boolean).join(", ");

    const loginEmail = p.email || "";

    return `
    <section class="member">
      <div class="memberHead">
        <div>
          <div class="name">
            <span class="number">Synagogue #${esc(s.synagogue_number ?? "—")}</span>
            ${val(s.synagogue_name || s.name)}
          </div>
          <div><strong>Rabbi:</strong> ${val(s.rabbi_name || s.hebrew_name)}</div>
        </div>
        <div>
          <span class="pill">${esc(shownStatus)}</span>
        </div>
      </div>

      <div class="details">
        <div><b>Rabbi / Contact Full Name</b>${val(p.full_name || s.rabbi_name)}</div>
        <div><b>Telephone</b>${val(p.phone)}</div>
        <div><b>Login / Email</b>${val(loginEmail)}</div>
        <div><b>Member ID</b>${val(p.member_id || s.synagogue_number)}</div>

        <div><b>Full Address</b>${val(address)}</div>
        <div><b>Street</b>${val(p.street_address)}</div>
        <div><b>City</b>${val(p.city)}</div>
        <div><b>State / Region</b>${val(p.state_region)}</div>

        <div><b>ZIP / Postal Code</b>${val(p.postal_code)}</div>
        <div><b>Country</b>${val(p.country)}</div>
        <div><b>Registered</b>${s.created_at ? esc(new Date(s.created_at).toLocaleString()) : "—"}</div>
        <div>
          <b>Password</b>
          <div class="loginBlock">
            ${loginEmail
              ? `<button class="info" onclick="resetPassword('${esc(loginEmail)}')">Send Reset Link</button>`
              : `No login email`}
          </div>
          <div class="small">For security, existing passwords cannot be displayed.</div>
        </div>
      </div>

      <div class="memberActions">
        <button class="success" onclick="approve('${s.id}')">Approve + 7 Days</button>
        <button onclick="activate('${s.id}')">Activate</button>
        <button class="danger" onclick="suspendMember('${s.id}')">Suspend</button>
        <button class="danger" onclick="deleteMember('${s.id}')">Delete Access</button>

        <label>
          Monthly Price $
          <input class="price" id="price_${s.id}" type="number" min="0" step="0.01"
            value="${(Number(s.price_monthly_cents)||0)/100}">
        </label>
        <button onclick="setPrice('${s.id}')">Save Price</button>

        ${s.slug
          ? `<a class="btn secondary" target="_blank" href="index.html?s=${encodeURIComponent(s.slug)}">Open Board</a>`
          : ""}
      </div>
    </section>`;
  }).join("");

  msg.textContent = `${list.length} synagogue account(s)`;
}

async function resetPassword(email){
  if(!email) return;

  if(!confirm("Send a password reset email to:\\n" + email + " ?")) return;

  msg.textContent = "Sending password reset email...";

  const redirectTo = new URL("update-password.html", window.location.href).href;

  const {error} = await sb.auth.resetPasswordForEmail(email,{
    redirectTo: redirectTo
  });

  if(error){
    msg.textContent = "Reset error: " + error.message;
    return;
  }

  msg.textContent = "Password reset link sent to " + email;
}

async function approve(id){
  const now = new Date();
  const end = new Date(Date.now() + 7 * 86400000);

  const {error} = await sb.from("synagogues").update({
    status:"trial",
    trial_starts_at:now.toISOString(),
    trial_ends_at:end.toISOString(),
    approved_at:now.toISOString()
  }).eq("id",id);

  if(error){ msg.textContent = error.message; return; }
  loadMembers();
}

async function activate(id){
  const {error} = await sb.from("synagogues")
    .update({status:"active"})
    .eq("id",id);

  if(error){ msg.textContent = error.message; return; }
  loadMembers();
}

async function suspendMember(id){
  const {error} = await sb.from("synagogues")
    .update({status:"suspended"})
    .eq("id",id);

  if(error){ msg.textContent = error.message; return; }
  loadMembers();
}

async function deleteMember(id){
  if(!confirm("Delete this synagogue's access?")) return;

  const {error} = await sb.from("synagogues")
    .update({status:"deleted"})
    .eq("id",id);

  if(error){ msg.textContent = error.message; return; }
  loadMembers();
}

async function setPrice(id){
  const dollars = Number(document.getElementById("price_"+id).value) || 0;

  const {error} = await sb.from("synagogues")
    .update({price_monthly_cents:Math.round(dollars*100)})
    .eq("id",id);

  if(error){ msg.textContent = error.message; return; }
  msg.textContent = "Monthly price saved.";
}

loadMembers();
</script>
</body>
</html>
