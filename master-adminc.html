<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christian Master Admin</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);color:#fff;padding:24px}.card{width:min(1500px,98vw);margin:auto;background:linear-gradient(180deg,#0b2b5d,#061a3b);border:3px solid #d7a62d;border-radius:24px;padding:24px}h1{color:#f6d469;text-align:center}.muted{text-align:center;color:#d8dfef}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px}.msg{text-align:center;font-weight:800}.member{background:#fff;color:#111;border-radius:16px;padding:16px;margin:14px 0;border-left:7px solid #d7a62d}.memberHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.name{font-size:21px;font-weight:900}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e7e7e7;font-weight:800;font-size:12px}.details{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px 18px;margin:12px 0}.details div{overflow-wrap:anywhere}.details b{display:block;color:#53617a;font-size:11px;text-transform:uppercase;margin-bottom:2px}.memberActions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px}button,.btn{border:0;border-radius:9px;padding:9px 11px;background:#d7a62d;color:#07152d;font-weight:900;cursor:pointer;text-decoration:none}.secondary{background:#e9eef7}.danger{background:#b51f26;color:#fff}.success{background:#2f9d57;color:#fff}.price{width:90px;padding:8px}@media(max-width:900px){.details{grid-template-columns:repeat(2,minmax(150px,1fr))}}@media(max-width:540px){.details{grid-template-columns:1fr}}</style></head>
<body><div class="card"><h1>Christian Master Admin</h1><p class="muted">Synagogue and Christian Church registrations • full contact, address and referral details • approval, 7-day trial and payment access.</p><div class="actions"><button onclick="loadMembers()">Refresh</button><button class="secondary" onclick="logoutApp()">Logout</button></div><div id="msg" class="msg"></div><div id="rows"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script>
<script>
let sb;
async function guard(){sb=getSupabase();const {data:{session}}=await sb.auth.getSession();if(!session){location.href='loginc.html';return false;}const {data:p}=await sb.from('profiles').select('role').eq('user_id',session.user.id).single();if(!p||p.role!=='master'){location.href='loginc.html';return false;}return true;}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function val(x){return esc(x||'—')}
async function loadMembers(){
 if(!(await guard()))return;msg.textContent='Loading…';
 const sel='*,profiles!synagogues_owner_user_id_fkey(email,full_name,phone,member_id,street_address,city,state_region,postal_code,country,heard_about,referred_by,referral_code),synagogue_settings(settings)';
 const {data,error}=await sb.from('synagogues').select(sel).order('created_at',{ascending:false});
 if(error){msg.textContent=error.message;return;}
  const filtered=(data||[]).filter(s=>String(s.account_type||"synagogue").toLowerCase()==="church");
 rows.innerHTML=filtered.map(s=>{
  const p=s.profiles||{};const ss=Array.isArray(s.synagogue_settings)?s.synagogue_settings[0]:s.synagogue_settings;const st=ss?.settings||{};const type='church';const isChurch=true;const left=s.status==='trial'?daysLeft(s.trial_ends_at):null;const shown=(s.status==='trial'&&left===0)?'expired':s.status;const board='indexc.html';
  const address=[p.street_address,p.city,p.state_region,p.postal_code,p.country].filter(Boolean).join(', ');
  return `<div class="member"><div class="memberHead"><div><div class="name">${isChurch?'✝️ Church':'✡️ Synagogue'} — ${esc(s.synagogue_name)}</div><div>${isChurch?'Pastor / Priest':'Rabbi'}: ${val(s.rabbi_name)}</div></div><div><span class="pill">${esc(shown)}</span> <span class="pill">${esc(p.member_id||'No Member ID')}</span></div></div>
  <div class="details"><div><b>Contact name</b>${val(p.full_name)}</div><div><b>Email</b>${val(p.email)}</div><div><b>Phone</b>${val(p.phone)}</div><div><b>Board slug</b>${val(s.slug)}</div><div><b>Street / Full address</b>${val(address)}</div><div><b>City</b>${val(p.city)}</div><div><b>State / Region</b>${val(p.state_region)}</div><div><b>ZIP / Postal</b>${val(p.postal_code)}</div><div><b>Country</b>${val(p.country)}</div><div><b>How heard about us</b>${val(p.heard_about)}</div><div><b>Referred by</b>${val(p.referred_by)}</div><div><b>Referral code</b>${val(p.referral_code)}</div><div><b>Trial</b>${left===null?'—':left+' day'+(left===1?'':'s')+' left'}</div><div><b>Created</b>${s.created_at?new Date(s.created_at).toLocaleString():'—'}</div></div>
  <div class="memberActions"><label>Price $ <input class="price" id="price_${s.id}" type="number" min="0" step="0.01" value="${(Number(s.price_monthly_cents)||0)/100}"></label><button onclick="setPrice('${s.id}')">Save price</button><a class="btn secondary" target="_blank" href="${board}?s=${encodeURIComponent(s.slug)}">Open Board</a><button class="success" onclick="approve('${s.id}')">Approve + 7 days</button><button onclick="activate('${s.id}')">Activate</button><button class="danger" onclick="suspendMember('${s.id}')">Suspend</button><button class="danger" onclick="deleteMember('${s.id}')">Delete</button></div></div>`;
 }).join('');msg.textContent=`${(data||[]).length} member account(s)`;
}
async function approve(id){const now=new Date(),end=new Date(Date.now()+7*86400000);await sb.from('synagogues').update({status:'trial',trial_starts_at:now.toISOString(),trial_ends_at:end.toISOString(),approved_at:now.toISOString()}).eq('id',id);loadMembers();}
async function activate(id){await sb.from('synagogues').update({status:'active'}).eq('id',id);loadMembers();}
async function suspendMember(id){await sb.from('synagogues').update({status:'suspended'}).eq('id',id);loadMembers();}
async function deleteMember(id){if(!confirm("Delete this member's access?"))return;await sb.from('synagogues').update({status:'deleted'}).eq('id',id);loadMembers();}
async function setPrice(id){const dollars=Number(document.getElementById('price_'+id).value)||0;await sb.from('synagogues').update({price_monthly_cents:Math.round(dollars*100)}).eq('id',id);loadMembers();}
window.addEventListener('DOMContentLoaded',loadMembers);
</script></body></html>
