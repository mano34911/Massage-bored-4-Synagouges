<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>לוח בית הכנסת - שיעור יומי</title>

<meta name="theme-color" content="#00152b">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ============================================================
   BASIC PAGE
============================================================ */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;

  background:
    radial-gradient(
      circle at top,
      #073b66 0%,
      #032b4c 28%,
      #001b34 58%,
      #000b18 100%
    );

  color: white;

  font-family:
    Arial,
    "Noto Sans Hebrew",
    sans-serif;
}


/* ============================================================
   MAIN CONTAINER
============================================================ */

#app {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  position: relative;
}


/* ============================================================
   TOP HEADER
============================================================ */

.topHeader {

  height: 14vh;

  min-height: 100px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 8px 20px;

  background:
    linear-gradient(
      180deg,
      rgba(0,48,86,.96),
      rgba(0,20,42,.82)
    );

  border-bottom: 3px solid #1ab6ff;

  box-shadow:
    0 0 20px rgba(27,182,255,.65);
}


.bh {
  position: absolute;

  top: 12px;
  right: 20px;

  font-size: clamp(20px,2.5vw,34px);

  color: #5cffaa;

  font-weight: 900;
}


.synagogueName {

  margin: 0;

  font-size: clamp(
    32px,
    5vw,
    72px
  );

  color: white;

  text-shadow:
    0 0 10px #0099ff,
    0 0 22px #0099ff;

  font-weight: 900;
}


.subtitle {

  margin-top: 4px;

  font-size: clamp(
    18px,
    2.2vw,
    32px
  );

  color: #62e6a0;

  font-weight: bold;
}


/* ============================================================
   LESSON AREA
============================================================ */

.lessonArea {

  height: 80vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding:
    10px
    2vw
    12px;
}


/* ============================================================
   BIG DAILY LESSON FRAME
   REDUCED BY ABOUT 30%
============================================================ */

.lessonFrame {

  position: relative;

  width: 68%;

  height: 70%;

  border-radius: 34px;

  padding: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(4,31,59,.98),
      rgba(0,15,31,.98)
    );

  border: 6px solid #22aaff;

  box-shadow:

    0 0 16px #22aaff,

    0 0 38px rgba(0,175,255,.6),

    0 0 70px rgba(0,255,145,.25),

    inset 0 0 28px rgba(0,150,255,.12);

  overflow: hidden;
}


/* ============================================================
   DECORATIVE CORNERS
============================================================ */

.lessonFrame::before {

  content: "✡";

  position: absolute;

  top: 7px;
  left: 18px;

  font-size: clamp(35px,4vw,65px);

  color: #2fd58d;

  text-shadow:
    0 0 12px #2fd58d;

  z-index: 10;
}


.lessonFrame::after {

  content: "✡";

  position: absolute;

  top: 7px;
  right: 18px;

  font-size: clamp(35px,4vw,65px);

  color: #28baff;

  text-shadow:
    0 0 12px #28baff;

  z-index: 10;
}


/* ============================================================
   LESSON TITLE
============================================================ */

.lessonTitle {

  height: 13%;

  min-height: 64px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  font-size: clamp(
    30px,
    4.8vw,
    68px
  );

  line-height: 1;

  font-weight: 900;

  color: #ffffff;

  text-shadow:

    0 0 10px #0aa8ff,

    0 0 24px #0aa8ff;

  border-bottom:

    2px solid
    rgba(64,210,255,.55);
}


/* ============================================================
   SCROLLING WINDOW
============================================================ */

.lessonWindow {

  position: relative;

  height: 84%;

  width: 100%;

  overflow: hidden;

  margin-top: 1%;
}


/* gradient masks */

.lessonWindow::before {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 9%;

  z-index: 5;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(0,15,31,1),
      rgba(0,15,31,0)
    );
}


.lessonWindow::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 10%;

  z-index: 5;

  pointer-events: none;

  background:
    linear-gradient(
      0deg,
      rgba(0,15,31,1),
      rgba(0,15,31,0)
    );
}


/* ============================================================
   SCROLLING TEXT
============================================================ */

.lessonScroll {

  position: absolute;

  width: 94%;

  left: 3%;

  top: 100%;

  text-align: center;

  padding:
    24px
    3vw
    100px;

  font-size: clamp(
    24px,
    3.2vw,
    48px
  );

  line-height: 1.6;

  font-weight: 800;

  animation:
    scrollLesson
    95s
    linear
    infinite;

  will-change: transform;
}


/* ============================================================
   BLUE + GREEN TEXT
============================================================ */

.lessonBlock {

  margin:
    26px
    auto;

  max-width: 1500px;
}


.lessonBlock:nth-child(odd) {

  color: #35bfff;

  text-shadow:
    0 0 7px rgba(53,191,255,.7);
}


.lessonBlock:nth-child(even) {

  color: #56e39a;

  text-shadow:
    0 0 7px rgba(86,227,154,.65);
}


.lessonHeading {

  display: block;

  margin-bottom: 10px;

  color: white;

  font-size: 1.08em;

  font-weight: 900;
}


.lessonSeparator {

  width: 55%;

  height: 2px;

  margin:
    24px
    auto;

  background:
    linear-gradient(
      90deg,
      transparent,
      #22baff,
      #55e69a,
      transparent
    );
}


/* ============================================================
   SCROLL ANIMATION
============================================================ */

@keyframes scrollLesson {

  from {
    transform:
      translateY(0);
  }

  to {
    transform:
      translateY(
        calc(
          -100% - 90vh
        )
      );
  }

}


/* ============================================================
   BOTTOM STATUS
============================================================ */

.bottomBar {

  position: absolute;

  bottom: 4px;

  left: 0;

  width: 100%;

  height: 5vh;

  min-height: 34px;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 24px;

  font-size: clamp(
    13px,
    1.3vw,
    20px
  );

  color: #aacbdd;

  z-index: 20;

  direction: ltr;
}


.status {

  display: flex;

  align-items: center;

  gap: 7px;
}


.statusDot {

  width: 10px;

  height: 10px;

  border-radius: 50%;

  background: #44e69a;

  box-shadow:
    0 0 9px #44e69a;
}


.statusDot.error {

  background: #ff5656;

  box-shadow:
    0 0 9px #ff5656;
}


/* ============================================================
   REFRESH BUTTON
============================================================ */

.refreshButton {

  position: absolute;

  left: 12px;

  bottom: 12px;

  z-index: 50;

  border: 1px solid
    rgba(65,190,255,.5);

  border-radius: 12px;

  padding:
    8px
    13px;

  background:
    rgba(0,20,40,.75);

  color: #7ad6ff;

  font-size: 14px;

  cursor: pointer;
}


.refreshButton:hover {

  background:
    rgba(0,100,170,.45);
}


/* ============================================================
   SMALL ADMIN GEAR — BOTTOM RIGHT
============================================================ */

.adminGear {

  position: fixed;

  right: 8px;
  bottom: 8px;

  width: 30px;
  height: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 9999;

  border-radius: 50%;

  border:
    1px solid
    rgba(65,190,255,.55);

  background:
    rgba(0,20,40,.72);

  color: #7ad6ff;

  font-size: 16px;
  line-height: 1;

  text-decoration: none;

  cursor: pointer;

  opacity: .65;

  box-shadow:
    0 0 7px
    rgba(34,170,255,.35);

  transition:
    opacity .15s ease,
    transform .15s ease,
    background .15s ease;
}


.adminGear:hover {

  opacity: 1;

  background:
    rgba(0,100,170,.55);

  transform:
    scale(1.08);
}


.adminGear:active {

  transform:
    scale(.92);
}


/* ============================================================
   MOBILE
============================================================ */

@media
(max-width: 650px) {

  .topHeader {

    height: 13vh;
  }


  .lessonArea {

    height: 82vh;

    padding:
      7px;
  }


  .lessonFrame {

    width: 78%;

    height: 72%;

    border-width: 4px;

    border-radius: 22px;
  }


  .lessonScroll {

    width: 96%;

    left: 2%;

    font-size:
      clamp(
        21px,
        5.5vw,
        34px
      );

    line-height: 1.55;
  }


  .bottomBar {

    font-size: 11px;

    gap: 10px;
  }


  .adminGear {

    right: 6px;
    bottom: 6px;

    width: 27px;
    height: 27px;

    font-size: 14px;
  }

}


/* ============================================================
   LANDSCAPE TV
============================================================ */

@media
(min-width: 1200px) {

  .lessonScroll {

    font-size:
      clamp(
        30px,
        2.8vw,
        52px
      );
  }

}

</style>

</head>


<body>

<div id="app">


<!-- ============================================================
     HEADER
============================================================ -->

<header class="topHeader">

  <div class="bh">
    ב״ה
  </div>

  <h1 class="synagogueName">
    בית תורה
  </h1>

  <div class="subtitle">
    לוח מודעות דיגיטלי
  </div>

</header>


<!-- ============================================================
     DAILY LESSON
============================================================ -->

<main class="lessonArea">

  <section class="lessonFrame">

    <div
      id="lessonTitle"
      class="lessonTitle"
    >
      ✡ שיעור יומי ✡
    </div>


    <div class="lessonWindow">

      <div
        id="dailyLessonText"
        class="lessonScroll"
      >

        <div class="lessonBlock">

          <span class="lessonHeading">
            טוען שיעור יומי...
          </span>

          אנא המתן

        </div>

      </div>

    </div>

  </section>

</main>


<!-- ============================================================
     STATUS
============================================================ -->

<div class="bottomBar">

  <div class="status">

    <span
      id="statusDot"
      class="statusDot"
    ></span>

    <span id="statusText">
      Connecting...
    </span>

  </div>


  <div id="lastUpdate">
  </div>

</div>


<button
  class="refreshButton"
  onclick="loadDailyLesson()"
>
  ↻ Refresh
</button>


<!-- ============================================================
     SMALL ADMIN GEAR — BOTTOM RIGHT
============================================================ -->

<a
  href="admin.html"
  class="adminGear"
  title="Admin"
  aria-label="Admin"
>
  ⚙
</a>


</div>



<script>

/* ============================================================
   SUPABASE CONNECTION
============================================================ */

const SUPABASE_URL =
  "https://oyeeeooymrzemxfrvcon.supabase.co";


const SUPABASE_PUBLIC_KEY =
  "sb_publishable_F5jtSPiZ-BCxTiPT4XCW7w_LVJcOJ8j";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );


/* ============================================================
   ELEMENTS
============================================================ */

const lessonText =
  document.getElementById(
    "dailyLessonText"
  );


const lessonTitle =
  document.getElementById(
    "lessonTitle"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const statusDot =
  document.getElementById(
    "statusDot"
  );


const lastUpdate =
  document.getElementById(
    "lastUpdate"
  );


/* ============================================================
   SAFE HTML
============================================================ */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    )

    .replaceAll(
      "\n",
      "<br>"
    );

}


/* ============================================================
   CREATE SECTION
============================================================ */

function createBlock(
  heading,
  text
) {

  if (!text) {

    return "";

  }


  return `

    <div class="lessonBlock">

      <span class="lessonHeading">

        ${escapeHtml(heading)}

      </span>

      ${escapeHtml(text)}

    </div>

    <div class="lessonSeparator"></div>

  `;

}


/* ============================================================
   DEFAULT LESSON
============================================================ */

function showDefaultLesson() {

  lessonTitle.innerHTML =
    "✡ שיעור יומי ✡";


  lessonText.innerHTML = `

    ${createBlock(
      "📖 פסוק יומי",
      "קָרוֹב ה׳ לְכָל קֹרְאָיו, לְכֹל אֲשֶׁר יִקְרָאֻהוּ בֶאֱמֶת."
    )}


    ${createBlock(
      "🕯️ הלכה יומית",
      "כל יום הוא הזדמנות להוסיף עוד מצווה, עוד תפילה ועוד מעשה חסד."
    )}


    ${createBlock(
      "❤️ מוסר יומי",
      "האדם יכול לשנות את יומו במילה טובה, בסבלנות ובמעשה טוב."
    )}


    ${createBlock(
      "🔥 חסידות",
      "כאשר יהודי פונה אל הקב״ה באמת, הוא מגלה שהקב״ה קרוב אליו."
    )}


    ${createBlock(
      "📜 תהילים",
      "אמירת תהילים בכוונה מחזקת את האמונה ומקרבת את הלב לעבודת ה׳."
    )}


    ${createBlock(
      "📚 דף יומי",
      "לימוד תורה בכל יום מחבר את האדם לשרשרת התורה של עם ישראל."
    )}


    ${createBlock(
      "🌟 מסר להיום",
      "הוסף היום עוד מצווה, עוד חסד ועוד שלום."
    )}

  `;


  restartScrolling();

}


/* ============================================================
   LOAD FROM SUPABASE
============================================================ */

async function loadDailyLesson() {

  setStatus(
    "Checking for new lesson...",
    true
  );


  try {


    const {
      data,
      error
    } =
      await db

      .from(
        "daily_lessons"
      )

      .select(
        "*"
      )

      .eq(
        "active",
        true
      )

      .order(
        "lesson_date",
        {
          ascending: false
        }
      )

      .limit(1)

      .maybeSingle();


    if (error) {

      throw error;

    }


    if (!data) {

      console.log(
        "No lesson found."
      );

      showDefaultLesson();

      setStatus(
        "Default lesson displayed",
        false
      );

      return;

    }


    displayLesson(
      data
    );


    setStatus(
      "LIVE • Auto Update",
      true
    );


    const now =
      new Date();


    lastUpdate.textContent =
      "Updated: " +
      now.toLocaleTimeString();


  } catch (err) {


    console.error(
      "Daily lesson error:",
      err
    );


    showDefaultLesson();


    setStatus(
      "Offline / Default lesson",
      false
    );

  }

}


/* ============================================================
   DISPLAY LESSON
============================================================ */

function displayLesson(data) {

  lessonTitle.innerHTML =

    escapeHtml(
      data.title ||
      "✡ שיעור יומי ✡"
    );


  let html = "";


  html +=
    createBlock(
      "📖 פסוק יומי",
      data.pasuk
    );


  html +=
    createBlock(
      "🕯️ הלכה יומית",
      data.halacha
    );


  html +=
    createBlock(
      "❤️ מוסר יומי",
      data.mussar
    );


  html +=
    createBlock(
      "🔥 חסידות / תניא",
      data.chassidut
    );


  html +=
    createBlock(
      "📜 תהילים",
      data.tehillim
    );


  html +=
    createBlock(
      "📚 דף יומי",
      data.daf_yomi
    );


  html +=
    createBlock(
      "🌟 המסר להיום",
      data.message
    );


  if (!html.trim()) {

    html = `

      <div class="lessonBlock">

        אין תוכן לשיעור היומי

      </div>

    `;

  }


  lessonText.innerHTML =
    html;


  restartScrolling();

}


/* ============================================================
   RESTART SCROLL FROM BOTTOM
============================================================ */

function restartScrolling() {

  lessonText.style.animation =
    "none";


  void lessonText.offsetHeight;


  lessonText.style.animation =
    "scrollLesson 95s linear infinite";

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
  text,
  good
) {

  statusText.textContent =
    text;


  if (good) {

    statusDot.classList.remove(
      "error"
    );

  } else {

    statusDot.classList.add(
      "error"
    );

  }

}


/* ============================================================
   AUTO REFRESH EVERY 60 SECONDS
============================================================ */

setInterval(

  () => {

    loadDailyLesson();

  },

  60000

);


/* ============================================================
   REALTIME SUPABASE UPDATE
============================================================ */

db

.channel(
  "daily-lesson-live"
)

.on(

  "postgres_changes",

  {

    event: "*",

    schema: "public",

    table: "daily_lessons"

  },

  payload => {

    console.log(
      "New daily lesson update:",
      payload
    );


    loadDailyLesson();

  }

)

.subscribe(
  status => {

    console.log(
      "Realtime status:",
      status
    );

  }
);


/* ============================================================
   INITIAL LOAD
============================================================ */

loadDailyLesson();


</script>

</body>
</html>
