<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message Board Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(760px,96vw);background:linear-gradient(180deg,#0b2b5d,#061a3b);border:3px solid #d7a62d;border-radius:24px;box-shadow:0 20px 60px #0008,inset 0 0 0 2px #fff2a633;padding:28px}
h1{color:#f6d469;text-align:center;margin:0 0 8px}p{line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-weight:800}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #d7a62d;background:#fff;color:#111;font-size:16px}
button,.btn{display:inline-block;border:0;border-radius:11px;padding:12px 18px;background:#d7a62d;color:#07152d;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none}.secondary{background:#fff;color:#07152d}.danger{background:#b51f26;color:#fff}.success{background:#2f9d57;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.msg{min-height:24px;text-align:center;margin-top:12px;font-weight:800}.muted{color:#d8dfef;font-size:14px;text-align:center}
table{width:100%;border-collapse:collapse;background:#fff;color:#111;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#f2df9c}.pill{padding:4px 8px;border-radius:999px;background:#e7e7e7;font-weight:800;font-size:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}table{font-size:12px}}
</style>
</head>
<body><div class="card"><h1>Community Message Board</h1><p class="muted">Synagogue & Church Member Login</p>
<div class="grid"><label class="wide">Email<input id="email" type="email" autocomplete="email"></label><label class="wide">Password<input id="password" type="password" autocomplete="current-password"></label></div>
<div class="actions"><button onclick="login()">Login</button><a class="btn secondary" href="registerc.html">Register New Organization</a></div><div id="msg" class="msg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="saas-common.js"></script>
<script>
function safeNext(){
 const n=new URLSearchParams(location.search).get('next')||'';
 return /^(?:christian-index\.html|index\.html|church-admin\.html|admin\.html)(?:[?#].*)?$/.test(n)?n:'';
}
async function login(){
  const msg=document.getElementById("msg"); msg.textContent="Signing in…";
  try{
    const sb=getSupabase();
    const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
    if(error) throw error;
    const uid=data.user.id;
    const {data:p}=await sb.from("profiles").select("role").eq("user_id",uid).single();
    if(p&&p.role==="master"){location.href="master-admin.html";return;}
    const {data:s}=await sb.from("synagogues").select("*").eq("owner_user_id",uid).single();
    if(!s){location.href="pending.html";return;}
    const {data:setRow}=await sb.from('synagogue_settings').select('settings').eq('synagogue_id',s.id).maybeSingle();
    const settings=(setRow&&setRow.settings)||{};
    const isChurch=settings.organization_type==='church'||new URLSearchParams(location.search).get('type')==='church';
    const a=memberAccessState(s);
    if(!a.allowed){
      if(s.status==='trial' && s.trial_ends_at && new Date(s.trial_ends_at).getTime()<=Date.now()){
        location.href='paymentc.html?s='+encodeURIComponent(s.slug||'')+(isChurch?'&type=church':''); return;
      }
      location.href='pending.html'; return;
    }
    const next=safeNext();
    if(next){location.href=next;return;}
    location.href=isChurch?'adminc.html':'admin.html';
  }catch(e){msg.textContent=e.message||String(e);}
}
</script></body></html>
